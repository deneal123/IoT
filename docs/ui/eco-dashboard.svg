<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1300" height="900" viewBox="0 0 1300 900">
  <defs>
    <style>
      .dashboard{fill:#f8fafc}
      .sidebar{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1}
      .topbar{fill:#fff;stroke:#e2e8f0;stroke-width:1}
      .card{fill:#fff;stroke:#e2e8f0;stroke-width:1;rx:12;ry:12;filter:drop-shadow(0px 4px 6px rgba(0,0,0,0.05))}
      .title{font:bold 20px "Segoe UI", Arial, sans-serif;fill:#111}
      .subtitle{font:bold 18px "Segoe UI", Arial, sans-serif;fill:#334155}
      .text{font:14px "Segoe UI", Arial, sans-serif;fill:#334155}
      .caption{font:12px "Segoe UI", Arial, sans-serif;fill:#64748b}
      .label{font:12px "Segoe UI", Arial, sans-serif;fill:#64748b}
      .value{font:bold 22px "Segoe UI", Arial, sans-serif;fill:#0f172a}
      .delta-up{font:bold 12px "Segoe UI", Arial, sans-serif;fill:#16a34a}
      .delta-down{font:bold 12px "Segoe UI", Arial, sans-serif;fill:#dc2626}
      .nav-item{font:14px "Segoe UI", Arial, sans-serif;fill:#475569}
      .nav-item-active{font:bold 14px "Segoe UI", Arial, sans-serif;fill:#0f172a}
      .btn{fill:#3b82f6;rx:8;ry:8}
      .btn-text{font:bold 10px "Segoe UI", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .btn-outline{fill:#fff;stroke:#3b82f6;stroke-width:1.5;rx:8;ry:8}
      .btn-outline-text{font:bold 14px "Segoe UI", Arial, sans-serif;fill:#3b82f6;text-anchor:middle}
      .icon{fill:#64748b}
      .tab{fill:#fff;rx:8 8 0 0;ry:8 8 0 0}
      .tab-active{fill:#f1f5f9;rx:8 8 0 0;ry:8 8 0 0}
      .tab-text{font:14px "Segoe UI", Arial, sans-serif;fill:#64748b;text-anchor:middle}
      .tab-text-active{font:bold 14px "Segoe UI", Arial, sans-serif;fill:#0f172a;text-anchor:middle}
      .grid-line{stroke:#e2e8f0;stroke-width:1}
      .tooltip{fill:#1e293b;rx:6;ry:6;filter:drop-shadow(0px 4px 6px rgba(0,0,0,0.15))}
      .tooltip-text{font:12px "Segoe UI", Arial, sans-serif;fill:#f8fafc}
      .status-ok{fill:#86efac}
      .status-warning{fill:#fcd34d}
      .status-error{fill:#fca5a5}
      .chart-line{fill:none;stroke:#3b82f6;stroke-width:2}
      .chart-area{fill:url(#chart-gradient);opacity:0.2}
      .chart-dot{fill:#fff;stroke:#3b82f6;stroke-width:2}
      .legend-item{font:12px "Segoe UI", Arial, sans-serif;fill:#1e293b}
      .recommendation-card{fill:#fff;stroke:#dbeafe;stroke-width:2;rx:12;ry:12}
      .alert-badge{fill:#dc2626;rx:12;ry:12}
    </style>
    <linearGradient id="chart-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a12"/>
    </filter>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="energy-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="25%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1300" height="900" class="dashboard"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="900" class="sidebar"/>
  <text x="130" y="45" class="title" text-anchor="middle">Enterprise Eco Monitor</text>
  <line x1="20" y1="65" x2="240" y2="65" class="grid-line"/>
  
  <!-- Navigation items -->
  <g transform="translate(20, 85)">
    <rect width="220" height="44" rx="8" fill="#dbeafe"/>
    <text x="110" y="28" class="nav-item-active" text-anchor="middle">Мониторинг</text>
    <path class="icon" transform="translate(25, 14)" fill="#3b82f6" d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
  </g>
  
  <g transform="translate(20, 140)">
    <rect width="220" height="44" rx="8" fill="transparent"/>
    <text x="110" y="28" class="nav-item" text-anchor="middle">Аналитика</text>
    <path class="icon" transform="translate(25, 14)" d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
  </g>
  
  <g transform="translate(20, 195)">
    <rect width="220" height="44" rx="8" fill="transparent"/>
    <text x="110" y="28" class="nav-item" text-anchor="middle">Датчики IIoT</text>
    <path class="icon" transform="translate(25, 14)" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
  </g>
  
  <g transform="translate(20, 250)">
    <rect width="220" height="44" rx="8" fill="transparent"/>
    <text x="110" y="28" class="nav-item" text-anchor="middle">Отчеты GR</text>
    <path class="icon" transform="translate(25, 14)" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
  </g>
  
  <g transform="translate(20, 305)">
    <rect width="220" height="44" rx="8" fill="transparent"/>
    <text x="110" y="28" class="nav-item" text-anchor="middle">Рекомендации</text>
    <path class="icon" transform="translate(25, 14)" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
    <path class="icon" transform="translate(31, 20)" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
  </g>
  
  <line x1="20" y1="365" x2="240" y2="365" class="grid-line"/>
  
  <!-- User info -->
  <g transform="translate(20, 385)">
    <circle cx="28" cy="24" r="20" fill="#bfdbfe"/>
    <text x="28" y="30" text-anchor="middle" font-weight="bold" fill="#1e40af" font-size="14px">АО</text>
    <text x="64" y="22" class="text">Елена Козлова</text>
    <text x="64" y="42" class="caption">Эко-аналитик</text>
  </g>
  
  <!-- Topbar -->
  <rect x="260" y="0" width="1040" height="70" class="topbar"/>
  <text x="280" y="42" class="title">Экологический мониторинг предприятия</text>
  <text x="1100" y="42" class="text">12 мая 2023 • 14:28</text>
  
  <!-- Facility selector -->
  <g transform="translate(280, 90)">
    <rect width="180" height="44" rx="8" class="tab-active"/>
    <text x="90" y="28" class="tab-text-active">Производство</text>
  </g>
  <g transform="translate(470, 90)">
    <rect width="180" height="44" rx="8" class="tab"/>
    <text x="90" y="28" class="tab-text">Энергетика</text>
  </g>
  
  <g transform="translate(280, 140)">
    <rect width="180" height="44" rx="8" class="tab"/>
    <text x="90" y="28" class="tab-text">Логистика</text>
  </g>
  <g transform="translate(470, 140)">
    <rect width="180" height="44" rx="8" class="tab"/>
    <text x="90" y="28" class="tab-text">Офисы</text>
  </g>
  
  <rect x="720" y="115" width="200" height="44" class="btn"/>
  <text x="775" y="143" fill="#ffffff" font-size="16px">Экспорт в GR</text>

  <!-- Quick stats -->
  <g transform="translate(280, 200)">
    <rect width="220" height="130" class="card"/>
    <text x="110" y="35" class="label" text-anchor="middle">ВЫБРОСЫ CO₂</text>
    <text x="110" y="70" class="value" text-anchor="middle">450 ppm</text>
    <text x="110" y="95" class="delta-up" text-anchor="middle">Норма</text>
    <text x="110" y="115" class="caption" text-anchor="middle">Лимит: 1000 ppm</text>
    <rect x="190" y="25" width="18" height="18" rx="9" class="status-ok"/>
  </g>
  
  <g transform="translate(520, 200)">
    <rect width="220" height="130" class="card"/>
    <text x="110" y="35" class="label" text-anchor="middle">ЭНЕРГОЭФФЕКТИВНОСТЬ</text>
    <text x="110" y="70" class="value" text-anchor="middle">85%</text>
    <text x="110" y="95" class="delta-up" text-anchor="middle">+15% к прошлому месяцу</text>
    <text x="110" y="115" class="caption" text-anchor="middle">Цель: 90% к концу года</text>
    <rect x="190" y="25" width="18" height="18" rx="9" class="status-ok"/>
  </g>
  
  <g transform="translate(760, 200)">
    <rect width="220" height="130" class="card"/>
    <text x="110" y="35" class="label" text-anchor="middle">КАЧЕСТВО ВОДЫ</text>
    <text x="110" y="70" class="value" text-anchor="middle">7.8 pH</text>
    <text x="110" y="95" class="caption" text-anchor="middle">Диапазон: 6.5-8.5 pH</text>
    <text x="110" y="115" class="caption" text-anchor="middle">Целевое: 7.5 pH</text>
    <rect x="190" y="25" width="18" height="18" rx="9" class="status-warning"/>
  </g>
  
  <g transform="translate(1000, 200)">
    <rect width="220" height="130" class="card"/>
    <text x="110" y="35" class="label" text-anchor="middle">СОБЫТИЯ</text>
    <text x="110" y="70" class="value" text-anchor="middle">3</text>
    <text x="110" y="95" class="caption" text-anchor="middle">2 предупреждения, 1 норма</text>
    <text x="110" y="115" class="caption" text-anchor="middle">Реагирование: 12 мин</text>
    <rect x="190" y="25" width="18" height="18" rx="9" class="status-warning"/>
  </g>
  
  <!-- Charts -->
  <g transform="translate(280, 350)">
    <rect width="580" height="300" class="card"/>
    <text x="290" y="35" class="subtitle" text-anchor="middle">Выбросы CO₂ в реальном времени</text>
    <text x="290" y="55" class="caption" text-anchor="middle">Концентрация CO₂ по цехам предприятия</text>
    
    <!-- Chart coordinates system -->
    <line x1="60" y1="80" x2="60" y2="250" class="grid-line"/>
    <line x1="60" y1="250" x2="540" y2="250" class="grid-line"/>
    
    <!-- Y-axis labels -->
    <text x="50" y="85" class="caption" text-anchor="end">1000</text>
    <text x="50" y="132" class="caption" text-anchor="end">750</text>
    <text x="50" y="179" class="caption" text-anchor="end">500</text>
    <text x="50" y="226" class="caption" text-anchor="end">250</text>
    <text x="50" y="273" class="caption" text-anchor="end">0</text>
    
    <!-- X-axis labels -->
    <text x="120" y="270" class="caption" text-anchor="middle">Цех А</text>
    <text x="240" y="270" class="caption" text-anchor="middle">Цех Б</text>
    <text x="360" y="270" class="caption" text-anchor="middle">Цех В</text>
    <text x="480" y="270" class="caption" text-anchor="middle">Цех Г</text>
    <text x="600" y="270" class="caption" text-anchor="middle">Цех Д</text>
    
    <!-- Grid lines -->
    <line x1="60" y1="85" x2="540" y2="85" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="132" x2="540" y2="132" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="179" x2="540" y2="179" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="60" y1="226" x2="540" y2="226" stroke="#f1f5f9" stroke-width="1"/>
    
    <line x1="180" y1="80" x2="180" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="300" y1="80" x2="300" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="420" y1="80" x2="420" y2="250" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Chart bars for enterprise monitoring -->
    <rect x="90" y="170" width="50" height="80" fill="#3b82f6" opacity="0.8"/>
    <rect x="210" y="140" width="50" height="110" fill="#3b82f6" opacity="0.8"/>
    <rect x="330" y="190" width="50" height="60" fill="#3b82f6" opacity="0.8"/>
    <rect x="450" y="120" width="50" height="130" fill="#dc2626" opacity="0.8"/>
    <rect x="570" y="180" width="50" height="70" fill="#3b82f6" opacity="0.8"/>
    
    <!-- Alert indicator for high emissions -->
    <g transform="translate(430, 85)">
      <rect width="90" height="28" class="alert-badge"/>
      <text x="45" y="18" text-anchor="middle" fill="#ffffff" font-size="10px">ПРЕВЫШЕНИЕ</text>
    </g>
    
    <!-- Legend -->
    <rect x="100" y="85" width="16" height="6" fill="#3b82f6"/>
    <text x="120" y="91" class="legend-item">В норме</text>
    
    <rect x="100" y="110" width="16" height="6" fill="#dc2626"/>
    <text x="120" y="117" class="legend-item">Превышение</text>
  </g>
  
  <!-- ML Recommendations Panel -->
  <g transform="translate(880, 350)">
    <rect width="340" height="300" class="card"/>
    <text x="170" y="35" class="subtitle" text-anchor="middle">Рекомендации AI</text>
    <text x="170" y="55" class="caption" text-anchor="middle">Предиктивная аналитика для оптимизации</text>
    
    <!-- Recommendation cards -->
    <g transform="translate(30, 80)">
      <rect width="280" height="70" class="recommendation-card"/>
      <text x="20" y="30" class="text" font-weight="bold">Оптимизация вентиляции</text>
      <text x="20" y="50" class="caption">Цех Г: снизить выбросы на 15%</text>
      <rect x="220" y="25" width="45" height="24" rx="6" fill="#3b82f6"/>
      <text x="242.5" y="39" text-anchor="middle" fill="#ffffff" font-size="7px">Применить</text>
    </g>
    
    <g transform="translate(30, 165)">
      <rect width="280" height="70" class="recommendation-card"/>
      <text x="20" y="30" class="text" font-weight="bold">Энергосбережение</text>
      <text x="20" y="50" class="caption">Ночной режим: экономия 230 кВт·ч</text>
      <rect x="220" y="25" width="45" height="24" rx="6" fill="#3b82f6"/>
      <text x="242.5" y="39" text-anchor="middle" fill="#ffffff" font-size="7px">Применить</text>
    </g>
    
    <g transform="translate(30, 250)">
      <rect width="280" height="45" class="recommendation-card"/>
      <text x="20" y="28" class="text" font-weight="bold">Готов отчет для GR</text>
      <rect x="210" y="15" width="65" height="24" rx="6" fill="#16a34a"/>
      <text x="242.5" y="30" class="btn-text" text-anchor="middle" font-size="11px">Экспорт</text>
    </g>
  </g>
  
  <!-- System status -->
  <g transform="translate(280, 670)">
    <rect width="940" height="160" class="card"/>
    <text x="30" y="35" class="subtitle">Состояние IIoT систем</text>
    
    <line x1="30" y1="50" x2="910" y2="50" class="grid-line"/>
    
    <!-- Table header -->
    <text x="30" y="75" class="label">СИСТЕМА</text>
    <text x="320" y="75" class="label">СТАТУС</text>
    <text x="480" y="75" class="label">ДАННЫЕ</text>
    <text x="650" y="75" class="label">ПОСЛЕДНЕЕ ОБНОВЛЕНИЕ</text>
    
    <!-- Table rows -->
    <line x1="30" y1="85" x2="910" y2="85" class="grid-line"/>
    
    <text x="30" y="110" class="text">Датчики качества воздуха</text>
    <text x="320" y="110" class="text">Активны</text>
    <rect x="480" y="102" width="130" height="14" rx="7" fill="#f1f5f9"/>
    <rect x="480" y="102" width="117" height="14" rx="7" fill="#3b82f6"/>
    <text x="620" y="110" class="caption">90%</text>
    <text x="650" y="110" class="caption">14:26:08 — 245 записей</text>
    <circle cx="305" cy="106" r="7" class="status-ok"/>
    
    <line x1="30" y1="125" x2="910" y2="125" class="grid-line"/>
    
    <text x="30" y="145" class="text">Мониторинг выбросов</text>
    <text x="320" y="145" class="text">Активен</text>
    <rect x="480" y="137" width="130" height="14" rx="7" fill="#f1f5f9"/>
    <rect x="480" y="137" width="104" height="14" rx="7" fill="#3b82f6"/>
    <text x="620" y="145" class="caption">80%</text>
    <text x="650" y="145" class="caption">14:27:32 — Цех Г: 890 ppm</text>
    <circle cx="305" cy="141" r="7" class="status-warning"/>
    
    <line x1="30" y1="160" x2="910" y2="160" class="grid-line"/>
  </g>
</svg>