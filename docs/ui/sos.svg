<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="880" viewBox="0 0 420 880">
  <defs>
    <style>
      .shell{fill:#f4f5f8;stroke:#111;stroke-width:2;rx:38;ry:38}
      .dark{fill:#111}
      .light{fill:#fff}
      .card{fill:#fff;stroke:#d8dce5;stroke-width:1.6;rx:16;ry:16;filter:drop-shadow(0px 4px 6px rgba(0,0,0,0.07))}
      .shadow{filter:url(#shadow)}
      .title{font:700 20px "DejaVu Sans", Arial, sans-serif;fill:#111}
      .text{font:14px "DejaVu Sans", Arial, sans-serif;fill:#1b1f23}
      .caption{font:12px "DejaVu Sans", Arial, sans-serif;fill:#64748b}
      .accent{fill:url(#red-gradient)}
      .btn-danger{fill:url(#red-gradient);stroke:#991b1b;stroke-width:1.4;rx:20;ry:20}
      .btn-danger-text{font:bold 24px "DejaVu Sans", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .chip{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;rx:16;ry:16}
      .chip-active{fill:url(#red-gradient-light);stroke:#dc2626;stroke-width:1.4;rx:16;ry:16}
      .chip-text{font:13px "DejaVu Sans", Arial, sans-serif;fill:#1e293b;text-anchor:middle}
      .light-accent{fill:#fee2e2}
      .accent-text{font:600 14px "DejaVu Sans", Arial, sans-serif;fill:#dc2626}
      .divider{stroke:#e2e8f0;stroke-width:1}
      .icon{fill:#475569}
      .info-circle{fill:#3b82f6;rx:12;ry:12}
      @keyframes pulse-critical {
        0% { transform: scale(1); filter: brightness(100%); }
        50% { transform: scale(1.1); filter: brightness(110%); }
        100% { transform: scale(1); filter: brightness(100%); }
      }
      .pulse-critical {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: pulse-critical 1.5s infinite ease-in-out;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .blink {
        animation: blink 2s infinite ease-in-out;
      }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1f2318"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feFlood flood-color="#ef4444" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feBlend in="SourceGraphic" in2="glow" mode="screen" />
    </filter>
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="red-gradient-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="amber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect class="shell" x="8" y="8" width="404" height="864"/>
  <rect class="dark" x="140" y="18" width="140" height="6" rx="3"/>

  <g transform="translate(28,54)">
    <text x="0" y="0" class="title">Экстренная помощь</text>
    <text x="0" y="24" class="caption">Используйте в случаях, требующих немедленной помощи</text>
  </g>

  <!-- Emergency button -->
  <g transform="translate(24,94)" class="shadow">
    <rect class="card" width="372" height="240"/>
    <circle cx="186" cy="120" r="66" fill="#fee2e2" stroke="#dc2626" stroke-width="3" class="pulse-critical"/>
    <circle cx="186" cy="120" r="60" class="btn-danger" filter="url(#glow)"/>
    <text x="186" y="130" class="btn-danger-text">SOS</text>
    <text x="186" y="219" class="caption" fill="#fee2e2" text-anchor="middle">Нажмите и удерживайте 1,5 секунды</text>
  </g>

  <!-- Assistance types -->
  <g transform="translate(24,350)" class="shadow">
    <rect class="card" width="372" height="175"/>
    <text x="24" y="36" class="text" font-weight="600">Выберите тип помощи</text>
    <rect class="chip-active" x="24" y="56" width="152" height="42"/>
    <text x="100" y="82" class="chip-text" text-anchor="middle" fill="#991b1b">Медицинская помощь</text>
    <rect class="chip" x="196" y="56" width="152" height="42"/>
    <text x="272" y="82" class="chip-text" text-anchor="middle" fill="#d97706">Конфликт / угроза</text>
    <rect class="chip" x="24" y="110" width="152" height="42"/>
    <text x="100" y="136" class="chip-text" text-anchor="middle">Пожар / задымление</text>
    <rect class="chip" x="196" y="110" width="152" height="42"/>
    <text x="272" y="136" class="chip-text" text-anchor="middle">Помощь ребенку</text>
  </g>

  <!-- Current location -->
  <g transform="translate(24,540)" class="shadow">
    <rect class="card" width="372" height="110"/>
    <rect x="24" y="24" width="24" height="24" rx="12" class="light-accent"/>
    <path class="icon" transform="translate(24,26)" fill="#dc2626" d="M12,2 C15.3137,2 18,4.68629 18,8 C18,12.5 12,19 12,19 C12,19 6,12.5 6,8 C6,4.68629 8.68629,2 12,2 Z M12,6 C10.8954,6 10,6.89543 10,8 C10,9.10457 10.8954,10 12,10 C13.1046,10 14,9.10457 14,8 C14,6.89543 13.1046,6 12,6 Z"/>
    <text x="60" y="41" class="text" font-weight="600">Ваше местоположение</text>
    <text x="24" y="68" class="caption">Сектор A12 · Ряд 7 · Место 14</text>
    <text x="24" y="88" class="caption">GPS передан, видеокамеры В-15-3 и В-15-4 активированы</text>
    <rect class="info-circle" x="324" y="24" width="24" height="24"/>
    <text x="336" y="37" class="caption" fill="#fff" font-weight="bold" text-anchor="middle">i</text>
  </g>

  <!-- Status info -->
  <g transform="translate(24,665)" class="shadow">
    <rect class="card" width="372" height="186"/>
    <text x="24" y="36" class="text" font-weight="600">Статус запроса #SOS-47823</text>
    
    <!-- Timeline -->
    <line x1="40" y1="54" x2="40" y2="172" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="64" r="6" fill="#10b981"/>
    <text x="58" y="68" class="caption">12:45:06 — Сигнал принят</text>
    
    <circle cx="40" cy="88" r="6" fill="#10b981"/>
    <text x="58" y="92" class="caption">12:45:08 — Передан в ЧОП и медпункт</text>
    
    <circle cx="40" cy="112" r="6" fill="#10b981"/>
    <text x="58" y="116" class="caption">12:45:32 — Бригада №3 выдвинулась</text>
    
    <circle cx="40" cy="136" r="6" fill="#fbbf24" class="blink"/>
    <text x="58" y="140" class="caption">12:46:18 — ETA 2 мин</text>
    
    <circle cx="40" cy="160" r="6" fill="#cbd5e1"/>
    <text x="58" y="164" class="caption">—:—:— — Помощь оказана</text>
    
    <rect class="chip" x="220" y="140" width="128" height="32"/>
    <text x="284" y="162" class="chip-text" text-anchor="middle">Отменить вызов</text>
  </g>
</svg>