<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <style>
      .dashboard{fill:#f8fafc}
      .sidebar{fill:#f1f5f9;stroke:#e2e8f0;stroke-width:1}
      .topbar{fill:#fff;stroke:#e2e8f0;stroke-width:1}
      .card{fill:#fff;stroke:#e2e8f0;stroke-width:1;rx:8;ry:8;filter:drop-shadow(0px 4px 6px rgba(0,0,0,0.05))}
      .title{font:bold 18px "DejaVu Sans", Arial, sans-serif;fill:#111}
      .subtitle{font:bold 16px "DejaVu Sans", Arial, sans-serif;fill:#334155}
      .text{font:14px "DejaVu Sans", Arial, sans-serif;fill:#334155}
      .caption{font:12px "DejaVu Sans", Arial, sans-serif;fill:#64748b}
      .label{font:12px "DejaVu Sans", Arial, sans-serif;fill:#64748b}
      .value{font:bold 20px "DejaVu Sans", Arial, sans-serif;fill:#0f172a}
      .delta-up{font:bold 12px "DejaVu Sans", Arial, sans-serif;fill:#16a34a}
      .delta-down{font:bold 12px "DejaVu Sans", Arial, sans-serif;fill:#dc2626}
      .nav-item{font:14px "DejaVu Sans", Arial, sans-serif;fill:#475569}
      .nav-item-active{font:bold 14px "DejaVu Sans", Arial, sans-serif;fill:#0f172a}
      .btn{fill:#3b82f6;rx:6;ry:6}
      .btn-text{font:bold 14px "DejaVu Sans", Arial, sans-serif;fill:#fff;text-anchor:middle}
      .btn-outline{fill:#fff;stroke:#3b82f6;stroke-width:1.5;rx:6;ry:6}
      .btn-outline-text{font:bold 14px "DejaVu Sans", Arial, sans-serif;fill:#3b82f6;text-anchor:middle}
      .icon{fill:#64748b}
      .tab{fill:#fff;rx:6 6 0 0;ry:6 6 0 0}
      .tab-active{fill:#f1f5f9;rx:6 6 0 0;ry:6 6 0 0}
      .tab-text{font:14px "DejaVu Sans", Arial, sans-serif;fill:#64748b;text-anchor:middle}
      .tab-text-active{font:bold 14px "DejaVu Sans", Arial, sans-serif;fill:#0f172a;text-anchor:middle}
      .grid-line{stroke:#e2e8f0;stroke-width:1}
      .tooltip{fill:#1e293b;rx:4;ry:4;filter:drop-shadow(0px 4px 6px rgba(0,0,0,0.15))}
      .tooltip-text{font:12px "DejaVu Sans", Arial, sans-serif;fill:#f8fafc}
      .status-ok{fill:#86efac}
      .status-warning{fill:#fcd34d}
      .status-error{fill:#fca5a5}
      .chart-line{fill:none;stroke:#3b82f6;stroke-width:2}
      .chart-area{fill:url(#chart-gradient);opacity:0.2}
      .chart-dot{fill:#fff;stroke:#3b82f6;stroke-width:2}
      .legend-item{font:12px "DejaVu Sans", Arial, sans-serif;fill:#1e293b}
    </style>
    <linearGradient id="chart-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a12"/>
    </filter>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <linearGradient id="energy-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="25%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="800" class="dashboard"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="800" class="sidebar"/>
  <text x="32" y="40" class="title">UMS Inventory Dashboard</text>
  <line x1="16" y1="60" x2="224" y2="60" class="grid-line"/>
  
  <!-- Navigation items -->
  <g transform="translate(16, 80)">
    <rect width="208" height="40" rx="6" fill="#dbeafe"/>
    <text x="48" y="26" class="nav-item-active">Запасы</text>
    <path class="icon" transform="translate(20, 12)" fill="#3b82f6" d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
  </g>
  
  <g transform="translate(16, 130)">
    <rect width="208" height="40" rx="6" fill="transparent"/>
    <text x="48" y="26" class="nav-item">Заказы</text>
    <path class="icon" transform="translate(20, 12)" d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
  </g>
  
  <g transform="translate(16, 180)">
    <rect width="208" height="40" rx="6" fill="transparent"/>
    <text x="48" y="26" class="nav-item">Поставки</text>
    <path class="icon" transform="translate(20, 12)" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
  </g>
  
  <g transform="translate(16, 230)">
    <rect width="208" height="40" rx="6" fill="transparent"/>
    <text x="48" y="26" class="nav-item">Полки</text>
    <path class="icon" transform="translate(20, 12)" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
  </g>
  
  <g transform="translate(16, 280)">
    <rect width="208" height="40" rx="6" fill="transparent"/>
    <text x="48" y="26" class="nav-item">RFID</text>
    <path class="icon" transform="translate(20, 12)" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
    <path class="icon" transform="translate(26, 18)" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
  </g>
  
  <line x1="16" y1="340" x2="224" y2="340" class="grid-line"/>
  
  <!-- User info -->
  <g transform="translate(16, 360)">
    <circle cx="24" cy="20" r="16" fill="#bfdbfe"/>
    <text x="24" y="25" text-anchor="middle" font-weight="bold" fill="#1e40af">АО</text>
    <text x="56" y="18" class="text">Мария Сидорова</text>
    <text x="56" y="36" class="caption">Складской менеджер</text>
  </g>
  
  <!-- Topbar -->
  <rect x="240" y="0" width="960" height="60" class="topbar"/>
  <text x="280" y="36" class="title">Управление складом</text>
  <text x="1020" y="36" class="text">12 мая 2023 • 14:28</text>
  
  <!-- Scenario selector -->
  <g transform="translate(280, 80)">
    <rect width="160" height="40" rx="6" class="tab-active"/>
    <text x="80" y="25" class="tab-text-active">Матч</text>
  </g>
  <g transform="translate(440, 80)">
    <rect width="160" height="40" rx="6" class="tab"/>
    <text x="80" y="25" class="tab-text">Концерт</text>
  </g>
  
  <g transform="translate(280, 120)">
    <rect width="160" height="40" rx="6" class="tab"/>
    <text x="80" y="25" class="tab-text">Ночной</text>
  </g>
  <g transform="translate(440, 120)">
    <rect width="160" height="40" rx="6" class="tab"/>
    <text x="80" y="25" class="tab-text">Эвакуация</text>
  </g>
  
  <rect x="660" y="100" width="180" height="40" class="btn"/>
  <text x="750" y="125" class="btn-text">Активировать сценарий</text>
  
  <!-- Quick stats -->
  <g transform="translate(280, 180)">
    <rect width="200" height="120" class="card"/>
    <text x="24" y="30" class="label">ЗАПАСЫ</text>
    <text x="24" y="60" class="value">85% заполнено</text>
    <text x="24" y="80" class="delta-up">5 позиций низко</text>
    <text x="24" y="100" class="caption">Критично: 3</text>
    <rect x="160" y="20" width="16" height="16" rx="8" class="status-ok"/>
  </g>
  
  <g transform="translate(500, 180)">
    <rect width="200" height="120" class="card"/>
    <text x="24" y="30" class="label">ЗАКАЗЫ</text>
    <text x="24" y="60" class="value">12 активных</text>
    <text x="24" y="80" class="delta-down">В пути: 8</text>
    <text x="24" y="100" class="caption">Прогноз на матч: 6,400 кВт·ч</text>
    <rect x="160" y="20" width="16" height="16" rx="8" class="status-ok"/>
  </g>
  
  <g transform="translate(720, 180)">
    <rect width="200" height="120" class="card"/>
    <text x="24" y="30" class="label">ТЕМПЕРАТУРА</text>
    <text x="24" y="60" class="value">+22.4 °C</text>
    <text x="24" y="80" class="caption">Диапазон: +21.8...+23.1 °C</text>
    <text x="24" y="100" class="caption">Целевая: +22.0 °C</text>
    <rect x="160" y="20" width="16" height="16" rx="8" class="status-ok"/>
  </g>
  
  <g transform="translate(940, 180)">
    <rect width="200" height="120" class="card"/>
    <text x="24" y="30" class="label">ПОПОЛНЕНИЕ</text>
    <text x="24" y="60" class="value">3</text>
    <text x="24" y="80" class="caption">2 разрешено, 1 в обработке</text>
    <text x="24" y="100" class="caption">Ср. время: 2.4 мин</text>
    <rect x="160" y="20" width="16" height="16" rx="8" class="status-warning"/>
  </g>
  
  <!-- Charts -->
  <g transform="translate(280, 320)">
    <rect width="520" height="280" class="card"/>
    <text x="24" y="30" class="subtitle">Загрузка входов</text>
    <text x="24" y="50" class="caption">Количество проходов по 15-минутным интервалам</text>
    
    <!-- Chart coordinates system -->
    <line x1="50" y1="70" x2="50" y2="230" class="grid-line"/>
    <line x1="50" y1="230" x2="490" y2="230" class="grid-line"/>
    
    <!-- Y-axis labels -->
    <text x="40" y="80" class="caption" text-anchor="end">1000</text>
    <text x="40" y="122" class="caption" text-anchor="end">750</text>
    <text x="40" y="164" class="caption" text-anchor="end">500</text>
    <text x="40" y="206" class="caption" text-anchor="end">250</text>
    <text x="40" y="248" class="caption" text-anchor="end">0</text>
    
    <!-- X-axis labels -->
    <text x="50" y="250" class="caption" text-anchor="middle">16:00</text>
    <text x="160" y="250" class="caption" text-anchor="middle">17:00</text>
    <text x="270" y="250" class="caption" text-anchor="middle">18:00</text>
    <text x="380" y="250" class="caption" text-anchor="middle">19:00</text>
    <text x="490" y="250" class="caption" text-anchor="middle">20:00</text>
    
    <!-- Grid lines -->
    <line x1="50" y1="80" x2="490" y2="80" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="122" x2="490" y2="122" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="164" x2="490" y2="164" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="206" x2="490" y2="206" stroke="#f1f5f9" stroke-width="1"/>
    
    <line x1="160" y1="70" x2="160" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="270" y1="70" x2="270" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="380" y1="70" x2="380" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Chart line -->
    <path class="chart-line" d="M50,206 L90,192 L130,164 L170,122 L210,95 L250,122 L290,150 L330,164 L370,185 L410,206 L450,215 L490,220"/>
    <path class="chart-area" d="M50,206 L90,192 L130,164 L170,122 L210,95 L250,122 L290,150 L330,164 L370,185 L410,206 L450,215 L490,220 L490,230 L50,230 Z"/>
    
    <!-- Highlight dot -->
    <circle cx="210" cy="95" r="6" class="chart-dot"/>
    
    <!-- Tooltip -->
    <g transform="translate(170, 40)">
      <rect width="140" height="48" class="tooltip"/>
      <text x="12" y="20" class="tooltip-text">17:30 — Пик потока</text>
      <text x="12" y="36" class="tooltip-text">942 человек/15 мин</text>
    </g>
    
    <!-- Legend -->
    <rect x="380" y="30" width="14" height="5" fill="#3b82f6"/>
    <text x="400" y="35" class="legend-item">Текущий матч</text>
    
    <rect x="380" y="50" width="14" height="5" fill="#94a3b8"/>
    <text x="400" y="55" class="legend-item">Средний показатель</text>
  </g>
  
  <g transform="translate(820, 320)">
    <rect width="320" height="280" class="card"/>
    <text x="24" y="30" class="subtitle">Тепловая карта</text>
    <text x="24" y="50" class="caption">Плотность размещения посетителей</text>
    
    <!-- Stadium heat map -->
    <rect x="40" y="70" width="240" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="60" y="90" width="200" height="140" rx="60" stroke="#94a3b8" stroke-width="1" fill="url(#pattern-stripes)"/>
    
    <ellipse cx="160" cy="160" rx="60" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    
    <!-- Heat blobs -->
    <circle cx="120" cy="120" r="30" fill="#22c55e" opacity="0.4"/>
    <circle cx="190" cy="200" r="25" fill="#fbbf24" opacity="0.4"/>
    <circle cx="210" cy="140" r="35" fill="#dc2626" opacity="0.4"/>
    <circle cx="110" cy="180" r="20" fill="#22c55e" opacity="0.4"/>
    <circle cx="80" cy="140" r="15" fill="#fbbf24" opacity="0.3"/>
    <circle cx="170" cy="150" r="10" fill="#fbbf24" opacity="0.3"/>
    
    <!-- Legend -->
    <rect x="40" y="260" width="14" height="5" fill="#22c55e"/>
    <text x="60" y="265" class="legend-item">&lt; 2 чел/м²</text>
    
    <rect x="140" y="260" width="14" height="5" fill="#fbbf24"/>
    <text x="160" y="265" class="legend-item">2-4 чел/м²</text>
    
    <rect x="240" y="260" width="14" height="5" fill="#dc2626"/>
    <text x="260" y="265" class="legend-item">&gt; 4 чел/м²</text>
  </g>
  
  <!-- System status -->
  <g transform="translate(280, 620)">
    <rect width="860" height="150" class="card"/>
    <text x="24" y="30" class="subtitle">Состояние подсистем</text>
    
    <line x1="24" y1="50" x2="836" y2="50" class="grid-line"/>
    
    <!-- Table header -->
    <text x="24" y="70" class="label">ПОДСИСТЕМА</text>
    <text x="300" y="70" class="label">СТАТУС</text>
    <text x="450" y="70" class="label">ЗАГРУЗКА</text>
    <text x="600" y="70" class="label">ПОСЛЕДНЕЕ СОБЫТИЕ</text>
    
    <!-- Table rows -->
    <line x1="24" y1="80" x2="836" y2="80" class="grid-line"/>
    
    <text x="24" y="100" class="text">Система контроля доступа</text>
    <text x="300" y="100" class="text">Активна</text>
    <rect x="450" y="92" width="120" height="12" rx="6" fill="#f1f5f9"/>
    <rect x="450" y="92" width="84" height="12" rx="6" fill="#3b82f6"/>
    <text x="580" y="100" class="caption">70%</text>
    <text x="610" y="100" class="caption">14:26:08 — Вход #7 забл.</text>
    <circle cx="290" cy="96" r="6" class="status-ok"/>
    
    <line x1="24" y1="110" x2="836" y2="110" class="grid-line"/>
    
    <text x="24" y="130" class="text">Система видеонаблюдения</text>
    <text x="300" y="130" class="text">Активна</text>
    <rect x="450" y="122" width="120" height="12" rx="6" fill="#f1f5f9"/>
    <rect x="450" y="122" width="96" height="12" rx="6" fill="#3b82f6"/>
    <text x="580" y="130" class="caption">80%</text>
    <text x="610" y="130" class="caption">14:27:32 — Камера B12-3</text>
    <circle cx="290" cy="126" r="6" class="status-warning"/>
    
    <line x1="24" y1="140" x2="836" y2="140" class="grid-line"/>
  </g>
</svg>