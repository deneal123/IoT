<?xml version="1.0" encoding="UTF-8"?>
<!--
  UMS: 5-Layer Architecture (Unified Style v1.0)
  Consistent palette, typography, corners, shadows, and motion with earlier diagrams.
  Reference image: ![image1](image1)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="auto" viewBox="0 0 1400 920"
     role="img" aria-labelledby="title desc">
  <title id="title">УМS — Пятиуровневая архитектура умного стадиона</title>
  <desc id="desc">Уровни: 1 — устройства; 2 — подсистемы; 3 — BMS/АСУЗ²; 4 — Платформа и клиентские приложения; 5 — внешние системы. Показаны шины, протоколы и режимы.</desc>

  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-neutral" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-side" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-warn" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow-success" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#16a34a" flood-opacity="0.18"/>
    </filter>

    <!-- Arrows -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0284c7"/>
    </marker>

    <!-- Badge -->
    <symbol id="badge" viewBox="0 0 30 30">
      <defs>
        <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </radialGradient>
      </defs>
      <circle cx="15" cy="15" r="14" fill="url(#badgeGrad)" stroke="#1e40af" stroke-width="2"/>
    </symbol>
  </defs>

  <!-- Styles -->
  <style>
    .title       { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
    .section-t   { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .process-t   { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .detail-t    { font: 12px "Segoe UI", Arial, sans-serif;  fill: #64748b; }
    .level-t     { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #0c4a6e; }

    .card { transition: transform 200ms ease, filter 200ms ease; }
    .card:hover { transform: translateY(-2px); }

    .panel { fill: url(#panelGradient); stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
    .side-panel { fill: url(#sideGradient); stroke: #0284c7; stroke-width: 2; rx: 12; ry: 12; }
    .warn-panel { fill: url(#warnGradient); stroke: #f59e0b; stroke-width: 2; rx: 12; ry: 12; }
    .success-panel { fill: url(#successGradient); stroke: #16a34a; stroke-width: 2; rx: 12; ry: 12; }
    .level-tag { fill: url(#sideGradient); stroke: #1e40af; stroke-width: 2; rx: 10; ry: 10; }

    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .success-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#green-arrow); }
    .warn-arrow { stroke: #f59e0b; stroke-width: 2; fill: none; marker-end: url(#amber-arrow); stroke-dasharray: 8 6; }
    .side-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#blue-arrow); stroke-dasharray: 5 5; }
    .line { stroke: #0284c7; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }

    .flow-anim { stroke-dasharray: 6 8; animation: flow 2.8s linear infinite; }
    .flow-anim.fast { animation-duration: 1.8s; }
    .pulse { transform-box: fill-box; animation: pulse 2.2s ease-in-out infinite; transform-origin: 50% 50%; }
    .pop-in { animation: pop 480ms cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.6s step-end infinite; }

    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.9;transform:scale(1.2)} }
    @keyframes pop { 0%{opacity:0;transform:translateY(6px) scale(.95)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes blink { 0%{opacity:0} 50%{opacity:1} 100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .flow-anim, .pulse, .pop-in, .blink { animation: none !important; }
    }
  </style>

  <!-- Left level tags (top to bottom: 5→1, as в примере) -->
  <g id="levels" aria-label="Метки уровней">
    <g class="pop-in" style="animation-delay:.02s">
      <rect class="level-tag" x="40" y="130" width="170" height="50" filter="url(#shadow-side)"/>
      <text x="125" y="160" class="level-t" text-anchor="middle">5. Внешние системы</text>
    </g>
    <g class="pop-in" style="animation-delay:.04s">
      <rect class="level-tag" x="40" y="253" width="170" height="50" filter="url(#shadow-side)"/>
      <text x="125" y="283" class="level-t" text-anchor="middle">4. Платформа</text>
    </g>
    <g class="pop-in" style="animation-delay:.06s">
      <rect class="level-tag" x="40" y="360" width="170" height="50" filter="url(#shadow-side)"/>
      <text x="125" y="390" class="level-t" text-anchor="middle">3. BMS</text>
    </g>
    <g class="pop-in" style="animation-delay:.08s">
      <rect class="level-tag" x="40" y="515" width="170" height="50" filter="url(#shadow-side)"/>
      <text x="125" y="546" class="level-t" text-anchor="middle">2. Системы</text>
    </g>
    <g class="pop-in" style="animation-delay:.10s">
      <rect class="level-tag" x="40" y="700" width="170" height="50" filter="url(#shadow-side)"/>
      <text x="125" y="730" class="level-t" text-anchor="middle">1. Оборудование</text>
    </g>
  </g>

  <!-- Level 5: External systems -->
  <g id="level5" class="pop-in" style="animation-delay:.12s" aria-label="Внешние системы">
    <g transform="translate(250,110)">
      <rect class="side-panel card" x="0" y="0" width="260" height="90" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">MAX</text>
      <text x="16" y="48" class="detail-t">e-ticket, уведомления, чат</text>
      <text x="16" y="66" class="detail-t">статусы мероприятий</text>
    </g>
    <g transform="translate(520,110)">
      <rect class="side-panel card" x="0" y="0" width="260" height="90" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">ЕПГУ / Госуслуги</text>
      <text x="16" y="48" class="detail-t">цифровой ID, возраст, льготы</text>
      <text x="16" y="66" class="detail-t">разрешения на массовые события</text>
    </g>
    <g transform="translate(790,110)">
      <rect class="side-panel card" x="0" y="0" width="260" height="90" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">GR / Надзор</text>
      <text x="16" y="48" class="detail-t">АСКУЭ/ресурсы, безопасность</text>
      <text x="16" y="66" class="detail-t">инциденты, видеослой города</text>
    </g>
    <g transform="translate(1060,110)">
      <rect class="side-panel card" x="0" y="0" width="260" height="90" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">Платежи / Банки / Страховые</text>
      <text x="16" y="48" class="detail-t">эквайринг, возвраты, split</text>
      <text x="16" y="66" class="detail-t">медсервисы и полисы</text>
    </g>
  </g>

  <!-- Level 4: Platform + Apps -->
  <g id="level4" class="pop-in" style="animation-delay:.16s" aria-label="Платформа и приложения">
    <rect class="panel card" x="250" y="230" width="1070" height="92" filter="url(#shadow-neutral)"/>
    <text x="270" y="260" class="process-t">Платформа: AuthN/AuthZ, Tickets, Parking, Retail, Navigation, VideoAI, Energy, Safety, Maintenance, API Gateway, CEP</text>
    <text x="270" y="280" class="detail-t">Kafka/NATS • TimescaleDB/InfluxDB • PostgreSQL • S3 • RabbitMQ</text>
    <text x="270" y="298" class="detail-t">Mobile/Web/Dispatcher — приложения, push-оповещения, AR-навигация, e-ticket</text>
    <!-- App chips -->
    <g transform="translate(1210,240)">
      <rect class="success-panel" x="0" y="0" width="90" height="30" filter="url(#shadow-success)"/>
      <text x="45" y="20" class="detail-t" text-anchor="middle">Mobile</text>
    </g>
    <g transform="translate(1210,275)">
      <rect class="success-panel" x="0" y="0" width="90" height="30" filter="url(#shadow-success)"/>
      <text x="45" y="20" class="detail-t" text-anchor="middle">Web/Desk</text>
    </g>
  </g>

  <!-- Level 3: BMS / SCADA -->
  <g id="level3" class="pop-in" style="animation-delay:.20s" aria-label="BMS/АСУЗ²">
    <rect class="panel card" x="360" y="340" width="860" height="96" filter="url(#shadow-neutral)"/>
    <text x="380" y="370" class="process-t">Единый диспетчерский слой: SCADA/BMS, сценарии (матч/концерт/ночь/эвакуация), тайминг-шаблоны</text>
    <text x="380" y="390" class="detail-t">Корреляция событий, SLA, журнал тревог, роли/подтверждения • Цифровой двойник</text>
    <circle cx="1200" cy="354" r="5" fill="#3b82f6" class="pulse"/>
  </g>

  <!-- Level 2: Subsystems -->
  <g id="level2" class="pop-in" style="animation-delay:.24s" aria-label="Подсистемы">
    <!-- Row 1 -->
    <g transform="translate(250,450)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">СКУД и периметр</text>
      <text x="16" y="48" class="detail-t">турникеты, шлагбаумы, биометрия</text>
    </g>
    <g transform="translate(480,450)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">ОПС / СОУЭ</text>
      <text x="16" y="48" class="detail-t">извещатели, оповещение,</text>
      <text x="16" y="68" class="detail-t">дымоудаление</text>
    </g>
    <g transform="translate(710,450)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">HVAC / Энергия</text>
      <text x="16" y="48" class="detail-t">чиллеры, насосы, ИБП/ДГУ,</text>
            <text x="16" y="68" class="detail-t">освещение</text>
    </g>
    <g transform="translate(940,450)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">VMS / ВидеоAI</text>
      <text x="16" y="48" class="detail-t">подсчет людей, аномалии, очереди</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(250,540)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">Навигация / RTLS</text>
      <text x="16" y="48" class="detail-t">BLE/UWB, карты помещений</text>
    </g>
    <g transform="translate(480,540)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">Парковка / ЭЗС</text>
      <text x="16" y="48" class="detail-t">места, тарифы, OCPP телеметрия</text>
    </g>
    <g transform="translate(710,540)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
      <text x="16" y="28" class="process-t">Ритейл / Кейтеринг</text>
      <text x="16" y="48" class="detail-t">POS, склад, очереди</text>
    </g>
    <g transform="translate(940,540)">
      <rect class="side-panel card" x="0" y="0" width="220" height="78" filter="url(#shadow-side)"/>
        <text x="16" y="28" class="process-t">Мед. безопасность</text>
      <text x="16" y="48" class="detail-t">AED, тревожные кнопки</text>
    </g>
  </g>

  <!-- Level 1: Devices -->
  <g id="level1" class="pop-in" style="animation-delay:.28s" aria-label="Устройства">
    <rect class="panel card" x="250" y="650" width="1070" height="140" filter="url(#shadow-neutral)"/>
    <text x="270" y="676" class="process-t">Field/Edge устройства</text>
    <text x="270" y="696" class="detail-t">• Доступ: турникеты NFC/QR/RFID, биометрия</text>
    <text x="270" y="716" class="detail-t">• Окружение: CO₂/PM2.5/температура/влажность/шум/вибрация/ветер/снег/освещённость/метeo</text>
    <text x="270" y="736" class="detail-t">• Инженерия: счётчики эл/вода/тепло/газ, протечки, HVAC актуаторы, VFD, PDU/UPS</text>
    <text x="870" y="696" class="detail-t">• Видео: IP/PTZ/тепловизоры, bodycam</text>
    <text x="870" y="716" class="detail-t">• Транспорт: ЭЗС, парковка, BLE-маяки, светофоры</text>
    <text x="870" y="736" class="detail-t">• Медицинский блок: AED телеметрия, браслеты</text>
    <text x="270" y="756" class="detail-t">• Ритейл: смарт-весы/холодильники, кассы • Сцена/поле: датчики газона, прожектора, крыша</text>
    <!-- Device hint icons (emojis) -->
    <text x="870" y="756" class="detail-t">🔐 🚪 🎫 📷 🛰️ 🌡️ 💧 🔌 ⚡ 🚗 🧭 🧯 🛒 🌱 💡</text>
  </g>

  <!-- Flows between layers -->
  <!-- 1 -> 2 (many-to-many) -->
  <path class="line flow-anim" d="M820,618 C820,650 820,650 820,645"/>
  <path class="line flow-anim" d="M360,618 C360,650 360,650 360,645"/>
    <path class="line flow-anim" d="M590,618 C590,650 590,650 590,645"/>
      <path class="line flow-anim" d="M1050,618 C1050,650 1050,650 1050,645"/>

<path class="line flow-anim" d="M1180,450 L1200,450"/>
<path class="line flow-anim" d="M1200,450 L1200,615"/>
<path class="line flow-anim" d="M1200,615 L1180,615"/>
<path class="line flow-anim" d="M1200,535 C1350,650 1350,350 1220,385"/>

  <!-- 3 -> 4 -->
  <path class="line flow-anim" d="M750,320 C750,330 750,330 750,340"/>

  <!-- 4 <-> 5 (bi-directional examples) -->
  <path class="line flow-anim" d="M1300,290 C1400,260 1400,200 1320,130"/>
    <path class="line flow-anim" d="M1300,255 C1400,260 1320,200 1320,180"/>
  <path class="line flow-anim" d="M650,200 C650,200 650,200 650,230"/>
    <path class="line flow-anim" d="M380,200 C380,200 380,200 380,230"/>
  <path class="line flow-anim" d="M920,200 C920,200 920,200 920,230"/>
    <path class="line flow-anim" d="M1190,200 C1190,200 1190,200 1190,230"/>
  
  <!-- Step badges (layer numbers) -->
  <g class="pop-in" style="animation-delay:.12s">
    <use href="#badge" x="20" y="140" width="30" height="30"/><text x="35" y="160" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">5</text>
  </g>
  <g class="pop-in" style="animation-delay:.16s">
    <use href="#badge" x="20" y="265" width="30" height="30"/><text x="35" y="285" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">4</text>
  </g>
  <g class="pop-in" style="animation-delay:.20s">
    <use href="#badge" x="20" y="370" width="30" height="30"/><text x="35" y="390" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">3</text>
  </g>
  <g class="pop-in" style="animation-delay:.24s">
    <use href="#badge" x="20" y="525" width="30" height="30"/><text x="35" y="545" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">2</text>
  </g>
  <g class="pop-in" style="animation-delay:.28s">
    <use href="#badge" x="20" y="710" width="30" height="30"/><text x="35" y="730" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">1</text>
  </g>
</svg>