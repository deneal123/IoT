<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1300 1100" role="img" aria-labelledby="title desc">
  <title id="title">UC7: Диаграмма управления логистикой и складом</title>
  <desc id="desc">IIoT-поток: мониторинг запасов → анализ спроса MES → прогноз потребления → решение о пополнении → заказ поставок → приемка RFID → обновление инвентаря → отчетность ERP</desc>

  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="errorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-neutral" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-warm" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-success" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#16a34a" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-error" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-side" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0284c7"/>
    </marker>

    <!-- Number badge symbol -->
    <symbol id="badge" viewBox="0 0 32 32">
      <defs>
        <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="url(#badgeGrad)" stroke="#1e40af" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Styles -->
  <style>
    /* Typography */
    .title       { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
    .process-t   { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .detail-t    { font: 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .decision-t  { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #92400e; text-anchor: middle; }
    .success-t   { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #166534; }
    .error-t     { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #991b1b; }
    .side-t      { font: 14px "Segoe UI", Arial, sans-serif; fill: #0c4a6e; }
    .flow-label  { font: 12px "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
    .yes-label   { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #16a34a; }
    .no-label    { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #dc2626; }

    /* Cards */
    .card { transition: transform 200ms ease, filter 200ms ease; }
    .card:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .process-box { fill: url(#panelGradient); stroke: #334155; stroke-width: 1.5; rx: 14; ry: 14; }
    .side-box { fill: url(#sideGradient); stroke: #0284c7; stroke-width: 1.5; rx: 10; ry: 10; }
    .decision-diamond { fill: url(#warnGradient); stroke: #f59e0b; stroke-width: 1.5; }
    .success-box { fill: url(#successGradient); stroke: #16a34a; stroke-width: 1.5; rx: 14; ry: 14; }
    .error-box { fill: url(#errorGradient); stroke: #dc2626; stroke-width: 1.5; rx: 14; ry: 14; }
    .terminator { fill: url(#successGradient); stroke: #16a34a; stroke-width: 1.5; }

    /* Arrows */
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .success-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#green-arrow); }
    .error-arrow { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#red-arrow); }
    .side-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#blue-arrow); }

    /* Motion */
    .flow-anim { stroke-dasharray: 8 10; animation: flow 2.5s linear infinite; }
    .flow-anim.fast { animation-duration: 1.5s; }
    .pulse { transform-box: fill-box; animation: pulse 2s ease-in-out infinite; transform-origin: 50% 50%; }
    .pop-in { animation: pop 500ms cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.6s step-end infinite; }

    @keyframes flow {
      to { stroke-dashoffset: -36; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;  transform: scale(1.15); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(8px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-anim, .pulse, .pop-in, .blink { animation: none !important; }
    }
  </style>

  <!-- START -->
  <g id="start" class="card pop-in" aria-label="Старт">
    <ellipse class="terminator" cx="220" cy="80" rx="70" ry="30" filter="url(#shadow-neutral)"/>
    <text x="220" y="85" style="font:700 15px 'Segoe UI', Arial, sans-serif; fill:#166534;" text-anchor="middle">СТАРТ</text>
  </g>

  <!-- Step 1: Мониторинг запасов -->
  <g id="step-1" class="card pop-in" style="animation-delay:.05s" aria-label="Мониторинг запасов">
    <rect class="process-box" x="50" y="140" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="165" class="process-t" text-anchor="middle">Мониторинг запасов</text>
    <text x="220" y="185" class="detail-t" text-anchor="middle">Датчики RFID и весовые на полках</text>
    <text x="220" y="205" class="detail-t" text-anchor="middle">Отслеживание уровней в реальном времени</text>
    
    <!-- Sensor indicators -->
    <use href="#rfid-sensor" x="320" y="150" width="20" height="20"/>
    <use href="#weight-sensor" x="345" y="150" width="20" height="20"/>
    <circle cx="335" cy="160" r="4" fill="#16a34a" class="pulse"/>
  </g>

  <!-- Step 2: Анализ спроса MES -->
  <g id="step-2" class="card pop-in" style="animation-delay:.1s" aria-label="Анализ спроса MES">
    <rect class="process-box" x="50" y="265" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="290" class="process-t" text-anchor="middle">Анализ спроса MES</text>
    <text x="220" y="310" class="detail-t" text-anchor="middle">Корреляция с заказами и событиями</text>
    <text x="220" y="330" class="detail-t" text-anchor="middle">Прогнозирование потребления</text>
  </g>

  <!-- Step 3: Прогноз потребления -->
  <g id="step-3" class="card pop-in" style="animation-delay:.15s" aria-label="Прогноз потребления">
    <rect class="process-box" x="50" y="390" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="415" class="process-t" text-anchor="middle">Прогноз потребления</text>
    <text x="220" y="435" class="detail-t" text-anchor="middle">ML-модели предсказания спроса</text>
    <text x="220" y="455" class="detail-t" text-anchor="middle">JIT (Just-in-Time) оптимизация</text>
  </g>

  <!-- Decision: Нужно пополнение? -->
  <g id="replenishment-decision" class="card pop-in" style="animation-delay:.2s" aria-label="Нужно пополнение?">
    <polygon class="decision-diamond" points="220,520 300,570 220,620 140,570" filter="url(#shadow-warm)"/>
    <text x="220" y="560" class="decision-t">Уровень</text>
    <text x="220" y="580" class="decision-t">критический?</text>
  </g>

  <!-- No path: Продолжить мониторинг -->
  <g id="continue-monitoring" class="card pop-in" style="animation-delay:.22s" aria-label="Продолжить мониторинг">
    <rect class="success-box" x="550" y="520" width="320" height="100" filter="url(#shadow-success)"/>
    <text x="710" y="545" class="success-t" text-anchor="middle">✓ Продолжить мониторинг</text>
    <text x="710" y="565" class="detail-t" text-anchor="middle">Уровни в норме</text>
    <text x="710" y="585" class="detail-t" text-anchor="middle">Следующая проверка через 1 час</text>
  </g>

  <!-- Step 4: Заказ поставок -->
  <g id="step-4" class="card pop-in" style="animation-delay:.25s" aria-label="Заказ поставок">
    <rect class="process-box" x="50" y="650" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="675" class="process-t" text-anchor="middle">Заказ поставок</text>
    <text x="220" y="695" class="detail-t" text-anchor="middle">Автоматический заказ у поставщиков</text>
    <text x="220" y="715" class="detail-t" text-anchor="middle">Интеграция с цепочкой поставок (SCM)</text>
  </g>

  <!-- Step 5: Приемка RFID -->
  <g id="step-5" class="card pop-in" style="animation-delay:.3s" aria-label="Приемка RFID">
    <rect class="process-box" x="50" y="775" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="800" class="process-t" text-anchor="middle">Приемка и сканирование</text>
    <text x="220" y="820" class="detail-t" text-anchor="middle">RFID-сканирование поставки</text>
    <text x="220" y="840" class="detail-t" text-anchor="middle">Автоматическое обновление инвентаря</text>
    
    <!-- RFID scanner indicator -->
    <use href="#rfid-sensor" x="320" y="785" width="20" height="20"/>
    <circle cx="330" cy="795" r="4" fill="#0284c7" class="blink"/>
  </g>

  <!-- Step 6: Отчетность ERP -->
  <g id="step-6" class="card pop-in" style="animation-delay:.35s" aria-label="Отчетность ERP">
    <rect class="process-box" x="50" y="900" width="340" height="100" filter="url(#shadow-neutral)"/>
    <text x="220" y="925" class="process-t" text-anchor="middle">Отчетность ERP</text>
    <text x="220" y="945" class="detail-t" text-anchor="middle">Финансовый учет и бюджетирование</text>
    <text x="220" y="965" class="detail-t" text-anchor="middle">Аналитика эффективности склада</text>
  </g>

  <!-- END -->
  <g id="end" class="card pop-in" style="animation-delay:.4s" aria-label="Конец">
    <ellipse class="terminator" cx="220" cy="1070" rx="70" ry="30" filter="url(#shadow-neutral)"/>
    <text x="220" y="1075" style="font:700 15px 'Segoe UI', Arial, sans-serif; fill:#166534;" text-anchor="middle">КОНЕЦ</text>
  </g>

  <!-- Side: Warehouse Personnel -->
  <g id="warehouse-personnel" class="card pop-in" style="animation-delay:.28s" aria-label="Складской персонал">
    <rect class="side-box" x="550" y="650" width="320" height="80" filter="url(#shadow-side)"/>
    <text x="710" y="675" class="side-t" text-anchor="middle">👨‍💼 Складской персонал</text>
    <text x="710" y="695" class="detail-t" text-anchor="middle">Получение заданий на пополнение</text>
    <text x="710" y="715" class="detail-t" text-anchor="middle">Подтверждение операций</text>
  </g>

  <!-- Side: Technical Stack -->
  <g id="tech-stack" class="card pop-in" style="animation-delay:.32s" aria-label="Технический стек">
    <rect class="side-box" x="550" y="300" width="320" height="190" filter="url(#shadow-side)"/>
    <text x="710" y="320" class="side-t" text-anchor="middle">Технический стек IIoT</text>
    <text x="710" y="345" class="detail-t" text-anchor="middle">🔗 Протоколы: Modbus/Profinet</text>
    <text x="710" y="365" class="detail-t" text-anchor="middle">📡 Связь: BLE/Zigbee для RFID</text>
    <text x="710" y="385" class="detail-t" text-anchor="middle">☁️ Платформа: AWS IoT/Azure</text>
    <text x="710" y="405" class="detail-t" text-anchor="middle">🤖 ML: Прогнозы спроса</text>
    <text x="710" y="425" class="detail-t" text-anchor="middle">🔒 Безопасность: ABAC + mTLS</text>
    <text x="710" y="445" class="detail-t" text-anchor="middle">📊 ERP: SAP/Oracle интеграция</text>
    <text x="710" y="465" class="detail-t" text-anchor="middle">⚙️ MES: Аналитика производства</text>
  </g>

  <!-- Main vertical flow (animated arrows) -->
  <path class="arrow flow-anim" d="M220,110 L220,140"/>
  <path class="arrow flow-anim" d="M220,240 L220,265"/>
  <path class="arrow flow-anim" d="M220,365 L220,390"/>
  <path class="arrow flow-anim" d="M220,490 L220,520"/>

  <!-- Decision branches -->
  <!-- YES (Critical) -->
  <path class="error-arrow flow-anim fast" d="M220,620 L220,650"/>
  <text x="235" y="635" class="no-label">ДА</text>
  <!-- NO (Normal) -->
  <path class="success-arrow flow-anim fast" d="M300,570 L550,570"/>
  <text x="400" y="562" class="yes-label">НЕТ</text>

  <!-- Return from monitoring to decision (curved) -->
  <path class="success-arrow flow-anim" d="M710,520 C680,500 350,520 220,520"/>

  <!-- Downstream arrows -->
  <path class="arrow flow-anim" d="M220,750 L220,775"/>
  <path class="arrow flow-anim" d="M220,875 L220,900"/>
  <path class="arrow flow-anim" d="M220,1000 L220,1030"/>

  <!-- Link to Warehouse Personnel -->
  <path class="side-arrow flow-anim" d="M390,690 L550,690"/>

  <!-- Flow step numbers (badges) -->
  <g class="pop-in" style="animation-delay:.06s">
    <use href="#badge" x="35" y="152" width="32" height="32"/>
    <text x="51" y="172" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">1</text>
  </g>
  <g class="pop-in" style="animation-delay:.11s">
    <use href="#badge" x="35" y="277" width="32" height="32"/>
    <text x="51" y="297" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">2</text>
  </g>
  <g class="pop-in" style="animation-delay:.16s">
    <use href="#badge" x="35" y="402" width="32" height="32"/>
    <text x="51" y="422" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">3</text>
  </g>
  <g class="pop-in" style="animation-delay:.26s">
    <use href="#badge" x="35" y="662" width="32" height="32"/>
    <text x="51" y="682" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">4</text>
  </g>
  <g class="pop-in" style="animation-delay:.31s">
    <use href="#badge" x="35" y="787" width="32" height="32"/>
    <text x="51" y="807" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">5</text>
  </g>
  <g class="pop-in" style="animation-delay:.36s">
    <use href="#badge" x="35" y="912" width="32" height="32"/>
    <text x="51" y="932" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">6</text>
  </g>

  <!-- Status Indicators -->
  <g id="status-indicators" class="pop-in" style="animation-delay:.38s">
    <rect x="550" y="750" width="320" height="130" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" ry="10"/>
    <text x="710" y="770" class="process-t" text-anchor="middle">Статусы запасов</text>
    
    <circle cx="570" cy="795" r="6" fill="#16a34a"/>
    <text x="590" y="800" class="detail-t">Оптимальный уровень</text>
    
    <circle cx="570" cy="815" r="6" fill="#f59e0b"/>
    <text x="590" y="820" class="detail-t">Низкий уровень (планирование)</text>
    
    <circle cx="570" cy="835" r="6" fill="#dc2626"/>
    <text x="590" y="840" class="detail-t">Критический уровень (срочный заказ)</text>
    
    <circle cx="570" cy="855" r="6" fill="#3b82f6"/>
    <text x="590" y="860" class="detail-t">В процессе пополнения</text>
  </g>

  <!-- Footer notes -->
  <text x="650" y="1070" class="detail-t" text-anchor="middle">
    IIoT Warehouse Management: автоматизация логистики с RFID, ML-прогнозами и интеграцией MES/ERP
  </text>
</svg>