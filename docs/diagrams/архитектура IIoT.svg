<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">IIoT Enterprise Architecture — Пятиуровневая промышленная архитектура</title>
  <desc id="desc">Уровни: 1 — Промышленные устройства и Edge; 2 — Подсистемы OT; 3 — BMS/SCADA/MES; 4 — IIoT Платформа; 5 — Enterprise системы. Показаны промышленные протоколы, Zero Trust безопасность и цифровые двойники.</desc>

  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-neutral" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-side" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-warn" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-success" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#16a34a" flood-opacity="0.15"/>
    </filter>

    <!-- Arrows -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0284c7"/>
    </marker>

    <!-- Badge -->
    <symbol id="badge" viewBox="0 0 32 32">
      <defs>
        <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="url(#badgeGrad)" stroke="#1e40af" stroke-width="1.5"/>
    </symbol>
  </defs>

  <!-- Styles -->
  <style>
    .title       { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
    .section-t   { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .process-t   { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .detail-t    { font: 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .level-t     { font: 700 14px "Segoe UI", Arial, sans-serif; fill: #0c4a6e; }
    .protocol-t  { font: 600 11px "Segoe UI", Arial, sans-serif; fill: #1e40af; text-anchor: middle; }

    .card { transition: transform 200ms ease, filter 200ms ease; }
    .card:hover { transform: translateY(-2px); filter: brightness(1.05); }

    .panel { fill: url(#panelGradient); stroke: #334155; stroke-width: 1.5; rx: 14; ry: 14; }
    .card-panel { fill: url(#panelGradient); stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
    .side-panel { fill: url(#sideGradient); stroke: #0284c7; stroke-width: 1.5; rx: 10; ry: 10; }
    .warn-panel { fill: url(#warnGradient); stroke: #f59e0b; stroke-width: 1.5; rx: 14; ry: 14; }
    .success-panel { fill: url(#successGradient); stroke: #16a34a; stroke-width: 1.5; rx: 14; ry: 14; }
    .level-tag { fill: url(#sideGradient); stroke: #1e40af; stroke-width: 1.5; rx: 10; ry: 10; }

    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .success-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#green-arrow); }
    .warn-arrow { stroke: #f59e0b; stroke-width: 2.5; fill: none; marker-end: url(#amber-arrow); stroke-dasharray: 8 6; }
    .side-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#blue-arrow); stroke-dasharray: 5 5; }
    .line { stroke: #0284c7; stroke-width: 2; fill: none; stroke-dasharray: 5 5; }

    .flow-anim { stroke-dasharray: 8 10; animation: flow 2.5s linear infinite; }
    .flow-anim.fast { animation-duration: 1.5s; }
    .pulse { transform-box: fill-box; animation: pulse 2s ease-in-out infinite; transform-origin: 50% 50%; }
    .pop-in { animation: pop 500ms cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.6s step-end infinite; }

    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%,100%{opacity:.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.15)} }
    @keyframes pop { 0%{opacity:0;transform:translateY(8px) scale(.95)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes blink { 0%{opacity:0} 50%{opacity:1} 100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .flow-anim, .pulse, .pop-in, .blink { animation: none !important; }
    }
  </style>

  <!-- Left level tags -->
  <g id="levels" aria-label="Метки уровней">
    <g class="pop-in" style="animation-delay:.02s">
      <rect class="level-tag" x="40" y="120" width="180" height="50" filter="url(#shadow-side)"/>
      <text x="130" y="150" class="level-t" text-anchor="middle">Enterprise системы</text>
    </g>
    <g class="pop-in" style="animation-delay:.04s">
      <rect class="level-tag" x="40" y="250" width="180" height="50" filter="url(#shadow-side)"/>
      <text x="130" y="280" class="level-t" text-anchor="middle">IIoT Платформа</text>
    </g>
    <g class="pop-in" style="animation-delay:.06s">
      <rect class="level-tag" x="40" y="370" width="180" height="50" filter="url(#shadow-side)"/>
      <text x="130" y="400" class="level-t" text-anchor="middle">BMS/SCADA/MES</text>
    </g>
    <g class="pop-in" style="animation-delay:.08s">
      <rect class="level-tag" x="40" y="530" width="180" height="50" filter="url(#shadow-side)"/>
      <text x="130" y="560" class="level-t" text-anchor="middle">Подсистемы OT</text>
    </g>
    <g class="pop-in" style="animation-delay:.10s">
      <rect class="level-tag" x="40" y="720" width="180" height="50" filter="url(#shadow-side)"/>
      <text x="130" y="750" class="level-t" text-anchor="middle">Пром. устройства</text>
    </g>
  </g>

  <!-- Level 5: Enterprise Systems -->
  <g id="level5" class="pop-in" style="animation-delay:.12s" aria-label="Enterprise системы">
    <g class="card">
      <rect class="side-panel" x="250" y="100" width="280" height="90" filter="url(#shadow-side)"/>
      <text x="390" y="125" class="process-t" text-anchor="middle">ERP / MAX</text>
      <text x="390" y="145" class="detail-t" text-anchor="middle">e-ticket, уведомления, интеграция</text>
      <text x="390" y="165" class="detail-t" text-anchor="middle">управление ресурсами, бюджетирование</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="550" y="100" width="280" height="90" filter="url(#shadow-side)"/>
      <text x="690" y="125" class="process-t" text-anchor="middle">MES / Производство</text>
      <text x="690" y="145" class="detail-t" text-anchor="middle">управление операциями, качеством</text>
      <text x="690" y="165" class="detail-t" text-anchor="middle">планирование производства, OEE</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="850" y="100" width="280" height="90" filter="url(#shadow-side)"/>
      <text x="990" y="125" class="process-t" text-anchor="middle">GR / Надзор</text>
      <text x="990" y="145" class="detail-t" text-anchor="middle">АСКУЭ/ресурсы, безопасность</text>
      <text x="990" y="165" class="detail-t" text-anchor="middle">инциденты, видеослой города</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="1150" y="100" width="280" height="90" filter="url(#shadow-side)"/>
      <text x="1290" y="125" class="process-t" text-anchor="middle">Городские системы</text>
      <text x="1290" y="145" class="detail-t" text-anchor="middle">транспорт, экология, энергетика</text>
      <text x="1290" y="165" class="detail-t" text-anchor="middle">интеграция с умным городом</text>
    </g>
  </g>

  <!-- Level 4: IIoT Platform -->
  <g id="level4" class="pop-in" style="animation-delay:.16s" aria-label="IIoT Платформа">
    <rect class="card-panel" x="250" y="230" width="1180" height="100" filter="url(#shadow-neutral)"/>
    <text x="840" y="255" class="process-t" text-anchor="middle">IIoT Платформа: Digital Twin, Analytics, Maintenance, Energy, Safety, API Gateway, CEP</text>
    <text x="840" y="275" class="detail-t" text-anchor="middle">Kafka/NATS • TimescaleDB/InfluxDB • PostgreSQL • S3 • RabbitMQ • Zero Trust Security</text>
    <text x="840" y="295" class="detail-t" text-anchor="middle">Mobile/Web/Dispatcher — приложения, микросервисы, mTLS, IAM</text>
    <!-- App chips -->
    <g class="card">
      <rect class="success-panel" x="1320" y="240" width="90" height="30" filter="url(#shadow-success)"/>
      <text x="1365" y="260" class="detail-t" text-anchor="middle">Mobile</text>
    </g>
    <g class="card">
      <rect class="success-panel" x="1320" y="280" width="90" height="30" filter="url(#shadow-success)"/>
      <text x="1365" y="300" class="detail-t" text-anchor="middle">Web/Desk</text>
    </g>
  </g>

  <!-- Level 3: BMS/SCADA/MES -->
  <g id="level3" class="pop-in" style="animation-delay:.20s" aria-label="BMS/SCADA/MES">
    <rect class="card-panel" x="360" y="350" width="960" height="100" filter="url(#shadow-neutral)"/>
    <text x="840" y="375" class="process-t" text-anchor="middle">BMS/SCADA/MES: Единый диспетчерский слой, цифровые двойники, CEP</text>
    <text x="840" y="395" class="detail-t" text-anchor="middle">Интеграция OT/IT, промышленные протоколы (OPC UA, MQTT), корреляция событий</text>
    <text x="840" y="415" class="detail-t" text-anchor="middle">Сценарии (матч/концерт/ночь/эвакуация), тайминг-шаблоны, SLA</text>
    <circle cx="1280" cy="360" r="6" fill="#3b82f6" class="pulse"/>
  </g>

  <!-- Level 2: OT Subsystems -->
  <g id="level2" class="pop-in" style="animation-delay:.24s" aria-label="Подсистемы OT">
    <!-- Row 1 -->
    <g class="card">
      <rect class="side-panel" x="250" y="470" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="380" y="495" class="process-t" text-anchor="middle">SCADA / PLC</text>
      <text x="380" y="515" class="detail-t" text-anchor="middle">Profinet, Modbus, EtherCAT</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="530" y="470" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="660" y="495" class="process-t" text-anchor="middle">HVAC / Энергия</text>
      <text x="660" y="515" class="detail-t" text-anchor="middle">чиллеры, насосы, ИБП/ДГУ</text>
      <text x="660" y="535" class="detail-t" text-anchor="middle">освещение, VFD</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="810" y="470" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="940" y="495" class="process-t" text-anchor="middle">VMS / ВидеоAI</text>
      <text x="940" y="515" class="detail-t" text-anchor="middle">подсчет людей, аномалии</text>
      <text x="940" y="535" class="detail-t" text-anchor="middle">очереди, аналитика</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="1090" y="470" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="1220" y="495" class="process-t" text-anchor="middle">Edge Computing</text>
      <text x="1220" y="515" class="detail-t" text-anchor="middle">локальная аналитика</text>
      <text x="1220" y="535" class="detail-t" text-anchor="middle">TSN, обработка данных</text>
    </g>
    <!-- Row 2 -->
    <g class="card">
      <rect class="side-panel" x="250" y="570" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="380" y="595" class="process-t" text-anchor="middle">Навигация / RTLS</text>
      <text x="380" y="615" class="detail-t" text-anchor="middle">BLE/UWB, карты помещений</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="530" y="570" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="660" y="595" class="process-t" text-anchor="middle">Парковка / ЭЗС</text>
      <text x="660" y="615" class="detail-t" text-anchor="middle">места, тарифы</text>
      <text x="660" y="635" class="detail-t" text-anchor="middle">OCPP телеметрия</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="810" y="570" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="940" y="595" class="process-t" text-anchor="middle">Ритейл / Кейтеринг</text>
      <text x="940" y="615" class="detail-t" text-anchor="middle">POS, склад, очереди</text>
    </g>
    <g class="card">
      <rect class="side-panel" x="1090" y="570" width="260" height="80" filter="url(#shadow-side)"/>
      <text x="1220" y="595" class="process-t" text-anchor="middle">Безопасность / СКУД</text>
      <text x="1220" y="615" class="detail-t" text-anchor="middle">турникеты, биометрия</text>
      <text x="1220" y="635" class="detail-t" text-anchor="middle">ОПС, контроль доступа</text>
    </g>
  </g>

  <!-- Level 1: Industrial Devices -->
  <g id="level1" class="pop-in" style="animation-delay:.28s" aria-label="Промышленные устройства">
    <rect class="card-panel" x="250" y="680" width="1180" height="150" filter="url(#shadow-neutral)"/>
    <text x="840" y="705" class="process-t" text-anchor="middle">Промышленные устройства и Edge-шлюзы</text>
    
    <text x="450" y="730" class="detail-t" text-anchor="middle">• PLC, датчики: температура, вибрация, давление</text>
    <text x="450" y="750" class="detail-t" text-anchor="middle">• Исполнительные механизмы: VFD, актуаторы HVAC</text>
    <text x="450" y="770" class="detail-t" text-anchor="middle">• Энергия: умные счетчики, PDU/UPS, мониторинг</text>
    <text x="450" y="790" class="detail-t" text-anchor="middle">• Промышленные протоколы: Profinet, Modbus</text>
    
    <text x="1230" y="730" class="detail-t" text-anchor="middle">• Видео: IP/PTZ/тепловизоры, видеоаналитика</text>
    <text x="1230" y="750" class="detail-t" text-anchor="middle">• Безопасность: СКУД, биометрия, тревожные кнопки</text>
    <text x="1230" y="770" class="detail-t" text-anchor="middle">• Транспорт: ЭЗС, парковочные сенсоры, BLE-маяки</text>
    <text x="1230" y="790" class="detail-t" text-anchor="middle">🔩 🛠️ 📡 🌡️ 💨 🔌 📷 🔒 🚗 ⚡</text>
  </g>

  <!-- Security Layer -->
  <g id="security" class="pop-in" style="animation-delay:.30s">
    <rect x="250" y="850" width="1180" height="60" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8" ry="8"/>
    <text x="840" y="870" class="process-t" text-anchor="middle" style="fill:#dc2626">Zero Trust Security Architecture</text>
    <text x="840" y="890" class="detail-t" text-anchor="middle" style="fill:#991b1b">mTLS • IAM • RBAC • Hardware Security Modules • Network Segmentation • Audit Logging</text>
  </g>

  <!-- Protocol Flows -->
  <!-- Industrial Protocols (Level 1-2) -->
  <text x="850" y="665" class="protocol-t">Profinet</text>
  
  <text x="610" y="665" class="protocol-t">Modbus</text>
  
  <text x="1060" y="665" class="protocol-t">EtherCAT</text>

  <!-- Platform Integration (Level 3-4) -->
  <text x="810" y="345" class="protocol-t">MQTT</text>

  <!-- Enterprise Integration (Level 4-5) -->
  <path class="side-arrow flow-anim" d="M1380,300 C1480,270 1480,210 1400,140"/>
  <text x="1420" y="220" class="protocol-t">REST API</text>
  
  <text x="660" y="210" class="protocol-t">SOAP</text>

  <!-- Step badges (layer numbers) -->
  <g class="pop-in" style="animation-delay:.12s">
    <use href="#badge" x="25" y="132" width="32" height="32"/>
    <text x="41" y="152" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">5</text>
  </g>
  <g class="pop-in" style="animation-delay:.16s">
    <use href="#badge" x="25" y="262" width="32" height="32"/>
    <text x="41" y="282" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">4</text>
  </g>
  <g class="pop-in" style="animation-delay:.20s">
    <use href="#badge" x="25" y="382" width="32" height="32"/>
    <text x="41" y="402" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">3</text>
  </g>
  <g class="pop-in" style="animation-delay:.24s">
    <use href="#badge" x="25" y="542" width="32" height="32"/>
    <text x="41" y="562" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">2</text>
  </g>
  <g class="pop-in" style="animation-delay:.28s">
    <use href="#badge" x="25" y="732" width="32" height="32"/>
    <text x="41" y="752" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">1</text>
  </g>

  <!-- Legend -->
  <g id="legend" class="pop-in" style="animation-delay:.32s">
    <rect x="40" y="870" width="180" height="80" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="8" ry="8"/>
    <text x="130" y="890" class="process-t" text-anchor="middle">Легенда протоколов</text>
    <line x1="50" y1="905" x2="70" y2="905" class="warn-arrow flow-anim"/>
    <text x="75" y="910" class="detail-t">Промышленные (OT)</text>
    <line x1="50" y1="920" x2="70" y2="920" class="side-arrow flow-anim"/>
    <text x="75" y="925" class="detail-t">Интеграционные (IT)</text>
    <line x1="50" y1="935" x2="70" y2="935" class="success-arrow flow-anim"/>
    <text x="75" y="940" class="detail-t">Платформенные</text>
  </g>
</svg>