<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1300 1000" role="img" aria-labelledby="title desc">
  <title id="title">UC9: Диаграмма интеграции с городскими системами</title>
  <desc id="desc">Поток: городские API данных → BMS корреляция → анализ необходимости изменений → обновление маршрутов → управление ЭЗС → уведомления посетителям → обратная связь в городские системы</desc>

  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-neutral" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-warm" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
    <filter id="shadow-side" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0284c7"/>
    </marker>

    <!-- Number badge symbol -->
    <symbol id="badge" viewBox="0 0 32 32">
      <defs>
        <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </radialGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="url(#badgeGrad)" stroke="#1e40af" stroke-width="1.5"/>
    </symbol>

    <!-- City icons -->
    <symbol id="traffic-icon" viewBox="0 0 24 24">
      <path d="M5 13h14v-2H5v2zm-2 6h14v-2H3v2zM7 7h10V5H7v2z" fill="#3b82f6"/>
    </symbol>
    <symbol id="weather-icon" viewBox="0 0 24 24">
      <path d="M6 16h12v2H6v-2zm6-12c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm0-2c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8z" fill="#0284c7"/>
    </symbol>
    <symbol id="ev-charger" viewBox="0 0 24 24">
      <path d="M18.92 2.01C18.72 1.42 18.16 1 17.5 1h-11c-.66 0-1.21.42-1.42 1.01L3 8v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1V8l-2.08-5.99zM6.5 12c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm11 0c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 7l1.5-4.5h11L19 7H5z" fill="#16a34a"/>
    </symbol>
  </defs>

  <!-- Styles -->
  <style>
    /* Typography */
    .title       { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
    .process-t   { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .detail-t    { font: 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
    .decision-t  { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #92400e; text-anchor: middle; }
    .side-t      { font: 14px "Segoe UI", Arial, sans-serif; fill: #0c4a6e; }
    .flow-label  { font: 12px "Segoe UI", Arial, sans-serif; fill: #475569; text-anchor: middle; }
    .yes-label   { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #16a34a; }
    .no-label    { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #dc2626; }

    /* Cards */
    .card { transition: transform 200ms ease, filter 200ms ease; }
    .card:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .process-box { fill: url(#panelGradient); stroke: #334155; stroke-width: 1.5; rx: 14; ry: 14; }
    .decision-diamond { fill: url(#warnGradient); stroke: #f59e0b; stroke-width: 1.5; }
    .side-box { fill: url(#sideGradient); stroke: #0284c7; stroke-width: 1.5; rx: 10; ry: 10; }
    .terminator { fill: url(#successGradient); stroke: #16a34a; stroke-width: 1.5; }

    /* Arrows */
    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .success-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#green-arrow); }
    .error-arrow { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#red-arrow); }
    .side-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#blue-arrow); }

    /* Motion */
    .flow-anim { stroke-dasharray: 8 10; animation: flow 2.5s linear infinite; }
    .flow-anim.fast { animation-duration: 1.5s; }
    .pulse { transform-box: fill-box; animation: pulse 2s ease-in-out infinite; transform-origin: 50% 50%; }
    .pop-in { animation: pop 500ms cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.6s step-end infinite; }

    @keyframes flow {
      to { stroke-dashoffset: -36; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%      { opacity: 1;  transform: scale(1.15); }
    }
    @keyframes pop {
      0% { opacity: 0; transform: translateY(8px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes blink {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-anim, .pulse, .pop-in, .blink { animation: none !important; }
    }
  </style>

  <!-- START -->
  <g id="start" class="card pop-in" style="animation-delay:.0s" aria-label="Старт">
    <ellipse class="terminator" cx="300" cy="80" rx="60" ry="30" filter="url(#shadow-neutral)"/>
    <text x="300" y="85" style="font:700 15px 'Segoe UI', Arial, sans-serif; fill:#166534;" text-anchor="middle">СТАРТ</text>
  </g>

  <!-- City Data APIs -->
  <g id="city-apis" class="card pop-in" style="animation-delay:.05s" aria-label="Городские API данных">
    <rect class="side-box" x="100" y="150" width="400" height="80" filter="url(#shadow-side)"/>
    <text x="300" y="175" class="side-t" text-anchor="middle">Городские API: трафик, погода, парковка</text>
    <text x="300" y="195" class="detail-t" text-anchor="middle">REST/GraphQL API: данные о пробках и погодных условиях</text>

    <!-- City data indicators -->
    <use href="#traffic-icon" x="455" y="160" width="20" height="20"/>
    <use href="#weather-icon" x="480" y="160" width="20" height="20"/>
    <circle cx="465" cy="165" r="4" fill="#3b82f6" class="blink"/>
  </g>

  <!-- BMS Data Correlation -->
  <g id="bms-correlation" class="card pop-in" style="animation-delay:.10s" aria-label="BMS корреляция данных">
    <rect class="process-box" x="100" y="260" width="400" height="80" filter="url(#shadow-neutral)"/>
    <text x="300" y="285" class="process-t" text-anchor="middle">BMS: корреляция городских данных</text>
    <text x="300" y="305" class="detail-t" text-anchor="middle">Анализ влияния трафика и погоды на посещаемость</text>
  </g>

  <!-- Decision Diamond -->
  <g id="decision" class="card pop-in" style="animation-delay:.15s" aria-label="Необходимы изменения?">
    <polygon class="decision-diamond" points="300,380 380,420 300,460 220,420" filter="url(#shadow-warm)"/>
    <text x="300" y="415" class="decision-t">Необходимы</text>
    <text x="300" y="435" class="decision-t">изменения?</text>
  </g>

  <!-- NO Branch - Continue Monitoring -->
  <g id="continue-monitor" class="card pop-in" style="animation-delay:.20s" aria-label="Продолжить мониторинг">
    <rect class="process-box" x="100" y="500" width="400" height="80" filter="url(#shadow-neutral)"/>
    <text x="300" y="525" class="process-t" text-anchor="middle">Продолжить мониторинг</text>
    <text x="300" y="545" class="detail-t" text-anchor="middle">Обновление данных через 2 минуты</text>
  </g>

  <!-- YES Branch - Integration Event -->
  <g id="integration-event" class="card pop-in" style="animation-delay:.22s" aria-label="Событие интеграции">
    <rect class="process-box" x="600" y="260" width="400" height="80" filter="url(#shadow-neutral)"/>
    <text x="800" y="285" class="process-t" text-anchor="middle">Генерация события интеграции</text>
    <text x="800" y="305" class="detail-t" text-anchor="middle">Публикация в шину событий с метаданными</text>
  </g>

  <!-- Route & EV Charging Update -->
  <g id="route-ev-update" class="card pop-in" style="animation-delay:.24s" aria-label="Обновление маршрутов и ЭЗС">
    <rect class="process-box" x="600" y="370" width="400" height="80" filter="url(#shadow-neutral)"/>
    <text x="800" y="395" class="process-t" text-anchor="middle">Обновление маршрутов и управление ЭЗС</text>
    <text x="800" y="415" class="detail-t" text-anchor="middle">Корректировка навигации и зарядных станций</text>
    
    <!-- EV charger indicator -->
    <use href="#ev-charger" x="965" y="380" width="20" height="20"/>
    <circle cx="975" cy="390" r="4" fill="#16a34a" class="pulse" style="animation-delay:.6s"/>
  </g>

  <!-- Visitor Notifications -->
  <g id="visitor-notifications" class="card pop-in" style="animation-delay:.26s" aria-label="Уведомления посетителям">
    <rect class="side-box" x="600" y="480" width="400" height="80" filter="url(#shadow-side)"/>
    <text x="800" y="505" class="side-t" text-anchor="middle">Уведомления посетителям</text>
    <text x="800" y="525" class="detail-t" text-anchor="middle">Push-уведомления о пробках и парковках</text>
  </g>

  <!-- City Feedback -->
  <g id="city-feedback" class="card pop-in" style="animation-delay:.28s" aria-label="Обратная связь в городские системы">
    <rect class="side-box" x="600" y="590" width="400" height="80" filter="url(#shadow-side)"/>
    <text x="800" y="615" class="side-t" text-anchor="middle">Обратная связь в городские системы</text>
    <text x="800" y="635" class="detail-t" text-anchor="middle">Передача данных для городского планирования</text>
  </g>

  <!-- Dispatcher Oversight -->
  <g id="dispatcher" class="card pop-in" style="animation-delay:.30s" aria-label="Контроль диспетчера">
    <rect class="process-box" x="600" y="700" width="400" height="80" filter="url(#shadow-neutral)"/>
    <text x="800" y="725" class="process-t" text-anchor="middle">Диспетчер: мониторинг и управление</text>
    <text x="800" y="745" class="detail-t" text-anchor="middle">Dashboard с городской аналитикой</text>
  </g>

  <!-- END -->
  <g id="end" class="card pop-in" style="animation-delay:.34s" aria-label="Конец">
    <ellipse class="terminator" cx="800" cy="850" rx="60" ry="30" filter="url(#shadow-neutral)"/>
    <text x="800" y="855" style="font:700 15px 'Segoe UI', Arial, sans-serif; fill:#166534;" text-anchor="middle">КОНЕЦ</text>
  </g>

  <!-- Main Flow Arrows -->
  <path class="arrow flow-anim" d="M300,110 L300,150"/>
  <path class="arrow flow-anim" d="M300,230 L300,260"/>
  <path class="arrow flow-anim" d="M300,340 L300,380"/>

  <!-- Decision Arrows -->
  <path class="success-arrow flow-anim fast" d="M220,420 L180,420 L180,460 L300,500"/>
  <text x="200" y="445" class="yes-label">НЕТ</text>

  <path class="error-arrow flow-anim fast" d="M380,420 L520,420 L600,300"/>
  <text x="480" y="415" class="no-label">ДА</text>

  <!-- Sequential Actions Flow (YES path) -->
  <path class="arrow flow-anim" d="M800,340 L800,370"/>
  <path class="arrow flow-anim" d="M800,450 L800,480"/>
  <path class="arrow flow-anim" d="M800,560 L800,590"/>
  <path class="arrow flow-anim" d="M800,670 L800,700"/>
  <path class="arrow flow-anim" d="M800,780 L800,825"/>

  <!-- Feedback Loop -->
  <path class="side-arrow flow-anim" d="M100,540 L50,540 L50,200 L100,190"/>
  <text x="60" y="370" class="flow-label" transform="rotate(-90 60 370)" fill="#0284c7">Постоянный мониторинг</text>

  <!-- Flow step numbers (badges) -->
  <g class="pop-in" style="animation-delay:.07s">
    <use href="#badge" x="85" y="162" width="32" height="32"/>
    <text x="101" y="182" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">1</text>
  </g>
  <g class="pop-in" style="animation-delay:.12s">
    <use href="#badge" x="85" y="272" width="32" height="32"/>
    <text x="101" y="292" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">2</text>
  </g>
  <g class="pop-in" style="animation-delay:.23s">
    <use href="#badge" x="585" y="272" width="32" height="32"/>
    <text x="601" y="292" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">3</text>
  </g>
  <g class="pop-in" style="animation-delay:.25s">
    <use href="#badge" x="585" y="382" width="32" height="32"/>
    <text x="601" y="402" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">4</text>
  </g>
  <g class="pop-in" style="animation-delay:.27s">
    <use href="#badge" x="585" y="492" width="32" height="32"/>
    <text x="601" y="512" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">5</text>
  </g>
  <g class="pop-in" style="animation-delay:.29s">
    <use href="#badge" x="585" y="602" width="32" height="32"/>
    <text x="601" y="622" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">6</text>
  </g>
  <g class="pop-in" style="animation-delay:.31s">
    <use href="#badge" x="585" y="712" width="32" height="32"/>
    <text x="601" y="732" style="font:700 13px Arial; fill:#fff; text-anchor:middle;">7</text>
  </g>

  <!-- Technical Stack Info -->
  <g id="tech-stack" class="card pop-in" style="animation-delay:.32s">
    <rect x="100" y="610" width="400" height="140" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="10" ry="10"/>
    <text x="300" y="630" class="process-t" text-anchor="middle">Технический стек интеграции</text>
    <text x="300" y="655" class="detail-t" text-anchor="middle">• API: REST/GraphQL с mTLS аутентификацией</text>
    <text x="300" y="675" class="detail-t" text-anchor="middle">• Протоколы: OCPP для ЭЗС, OPC UA для BMS</text>
    <text x="300" y="695" class="detail-t" text-anchor="middle">• Шина данных: Apache Kafka для событий</text>
    <text x="300" y="715" class="detail-t" text-anchor="middle">• Безопасность: Zero Trust Architecture</text>
    <text x="300" y="735" class="detail-t" text-anchor="middle">• Реал-тайм: TSN для синхронизации</text>
  </g>

  <!-- Legend -->
  <g id="legend" class="pop-in" style="animation-delay:.36s" aria-label="Легенда">
    <text x="600" y="900" class="detail-t">Легенда:</text>
    <rect class="process-box" x="600" y="910" width="24" height="16" rx="4" ry="4" filter="url(#shadow-neutral)"/>
    <text x="632" y="920" class="detail-t">Внутренний процесс</text>
    <rect class="side-box" x="780" y="910" width="24" height="16" rx="4" ry="4" filter="url(#shadow-side)"/>
    <text x="812" y="920" class="detail-t">Внешняя система</text>
    <polygon class="decision-diamond" points="920,910 936,918 920,926 904,918" filter="url(#shadow-warm)"/>
    <text x="950" y="920" class="detail-t">Точка решения</text>
  </g>
</svg>