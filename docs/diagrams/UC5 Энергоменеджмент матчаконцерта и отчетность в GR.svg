<?xml version="1.0" encoding="UTF-8"?>
<!--
  Energy Orchestration Timeline (Unified Style v1.0)
  Palette & tokens (consistent across project):
  - Ink / Text Dark: #1e293b / #334155 / #475569
  - Primary (Blue):  base #3b82f6  border #1e40af  accent #0284c7
  - Success (Green): base #16a34a  bg #dcfce7
  - Warning (Amber): base #f59e0b  bg #fef3c7
  - Error (Red):     base #dc2626  bg #fee2e2
  - Surface (Neutral): bg #f8fafc  side #e0f2fe
  Typography: "Segoe UI", Arial, sans-serif
  Corners: 12px primary, 8px side
  Shadows: soft, directional (2px/4px), colored per intent
  Motion: subtle, disable when prefers-reduced-motion
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="100%" height="auto" viewBox="0 0 1200 700"
     role="img" aria-labelledby="title desc">
  <title id="title">Таймлайн оркестрации энергосистемы</title>
  <desc id="desc">Этапы: предпрогрев/предохлаждение, предстартовое освещение, критический период пиковой нагрузки, сбор телеметрии, отчётность. Горизонтальный таймлайн с маркерами времени и потоками между фазами, легенда и KPI.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="panelGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sideGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="successGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="warnGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow-neutral" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-side" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-warn" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow-success" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#16a34a" flood-opacity="0.18"/>
    </filter>

    <!-- Arrows -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0284c7"/>
    </marker>

    <!-- Step badge -->
    <symbol id="badge" viewBox="0 0 30 30">
      <defs>
        <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#3b82f6"/>
        </radialGradient>
      </defs>
      <circle cx="15" cy="15" r="14" fill="url(#badgeGrad)" stroke="#1e40af" stroke-width="2"/>
    </symbol>
  </defs>

  <style>
    .title       { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #1e293b; text-anchor: middle; }
    .phase-t     { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
    .detail-t    { font: 12px "Segoe UI", Arial, sans-serif;  fill: #64748b; }
    .legend-t    { font: 12px "Segoe UI", Arial, sans-serif;  fill: #475569; }
    .kpi-t       { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #0c4a6e; }
    .timeline-t  { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #1e40af; text-anchor: middle; }
    .timeline-s  { font: 12px "Segoe UI", Arial, sans-serif;  fill: #64748b; text-anchor: middle; }

    .card { transition: transform 200ms ease, filter 200ms ease; }
    .card:hover { transform: translateY(-2px); }

    .phase-box { fill: url(#panelGradient); stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
    .critical-box { fill: url(#warnGradient); stroke: #f59e0b; stroke-width: 2; rx: 12; ry: 12; }
    .report-box { fill: url(#successGradient); stroke: #16a34a; stroke-width: 2; rx: 12; ry: 12; }
    .side-box { fill: url(#sideGradient); stroke: #0284c7; stroke-width: 2; rx: 8; ry: 8; }

    .arrow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .success-arrow { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#green-arrow); }
    .warn-arrow { stroke: #f59e0b; stroke-width: 2.5; fill: none; marker-end: url(#amber-arrow); stroke-dasharray: 8 6; }
    .side-arrow { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#blue-arrow); stroke-dasharray: 5 5; }

    .timeline { stroke: #1e40af; stroke-width: 3; fill: none; }
    .timedash { stroke-dasharray: 6 10; animation: flow 6s linear infinite; }
    .marker { fill: #3b82f6; stroke: #1e40af; stroke-width: 2; }

    .flow-anim { stroke-dasharray: 6 8; animation: flow 2.8s linear infinite; }
    .flow-anim.fast { animation-duration: 1.8s; }
    .pulse { transform-box: fill-box; animation: pulse 2.2s ease-in-out infinite; transform-origin: 50% 50%; }
    .pop-in { animation: pop 480ms cubic-bezier(.2,.8,.2,1) both; }
    .blink { animation: blink 1.6s step-end infinite; }

    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.9;transform:scale(1.2)} }
    @keyframes pop { 0%{opacity:0;transform:translateY(6px) scale(.95)} 100%{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes blink { 0%{opacity:0} 50%{opacity:1} 100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .flow-anim, .pulse, .pop-in, .blink, .timedash { animation: none !important; }
    }
  </style>

  <!-- Timeline -->
  <line x1="100" y1="120" x2="1100" y2="120" class="timeline timedash"/>

  <!-- Timeline markers -->
  <g class="pop-in" style="animation-delay:.02s">
    <circle cx="150" cy="120" r="7" class="marker pulse"/>
    <text x="150" y="145" class="timeline-t">T-2ч</text>
    <text x="150" y="162" class="timeline-s">Подготовка</text>
  </g>
  <g class="pop-in" style="animation-delay:.04s">
    <circle cx="300" cy="120" r="7" class="marker"/>
    <text x="300" y="145" class="timeline-t">T-30м</text>
    <text x="300" y="162" class="timeline-s">Предстарт</text>
  </g>
  <g class="pop-in" style="animation-delay:.06s">
    <circle cx="500" cy="120" r="8" class="marker pulse"/>
    <text x="500" y="145" class="timeline-t">T0</text>
    <text x="500" y="162" class="timeline-s">Старт события</text>
  </g>
  <g class="pop-in" style="animation-delay:.08s">
    <circle cx="750" cy="120" r="7" class="marker"/>
    <text x="750" y="145" class="timeline-t">T+Δ</text>
    <text x="750" y="162" class="timeline-s">Во время события</text>
  </g>
  <g class="pop-in" style="animation-delay:.10s">
    <circle cx="1000" cy="120" r="7" class="marker blink"/>
    <text x="1000" y="145" class="timeline-t">Отчётность</text>
    <text x="1000" y="162" class="timeline-s">Еженед./Ежемес.</text>
  </g>

  <!-- Phase 1 -->
  <g id="phase1" class="card pop-in" style="animation-delay:.12s" aria-label="Фаза 1: Предпрогрев/предохлаждение">
    <rect class="phase-box" x="90" y="200" width="180" height="118" filter="url(#shadow-neutral)"/>
    <text x="110" y="228" class="phase-t">Фаза 1</text>
    <text x="110" y="248" class="detail-t">Предпрогрев / предохлаждение</text>
    <text x="110" y="268" class="detail-t">• HVAC профили</text>
    <text x="110" y="286" class="detail-t">• Энергооптимизация</text>
    <use href="#badge" x="70" y="190" width="30" height="30"/><text x="85" y="210" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">1</text>
  </g>

  <!-- Phase 2 -->
  <g id="phase2" class="card pop-in" style="animation-delay:.14s" aria-label="Фаза 2: Освещение перед стартом">
    <rect class="phase-box" x="270" y="300" width="180" height="118" filter="url(#shadow-neutral)"/>
    <text x="290" y="328" class="phase-t">Фаза 2</text>
    <text x="290" y="348" class="detail-t">Освещение «перед стартом»</text>
    <text x="290" y="368" class="detail-t">• DALI профили</text>
    <text x="290" y="386" class="detail-t">• Сценарии освещения</text>
    <use href="#badge" x="250" y="290" width="30" height="30"/><text x="265" y="310" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">2</text>
  </g>

  <!-- Phase 3 (Critical) -->
  <g id="phase3" class="card pop-in" style="animation-delay:.16s" aria-label="Фаза 3: Пик нагрузки (критическая)">
    <rect class="critical-box" x="460" y="400" width="200" height="132" filter="url(#shadow-warn)"/>
    <text x="480" y="428" class="phase-t" style="fill:#92400e">Фаза 3 (критическая)</text>
    <text x="480" y="448" class="detail-t">Пик нагрузки → предикция</text>
    <text x="480" y="468" class="detail-t">• ML алгоритмы</text>
    <text x="480" y="486" class="detail-t">• Частотники VFD</text>
    <text x="480" y="504" class="detail-t">• Балансировка нагрузки</text>
    <use href="#badge" x="440" y="390" width="30" height="30"/><text x="455" y="410" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">3</text>
  </g>

  <!-- Phase 4 -->
  <g id="phase4" class="card pop-in" style="animation-delay:.18s" aria-label="Фаза 4: Сбор телеметрии">
    <rect class="phase-box" x="700" y="300" width="200" height="118" filter="url(#shadow-neutral)"/>
    <text x="720" y="328" class="phase-t">Фаза 4</text>
    <text x="720" y="348" class="detail-t">Сбор телеметрии (АСКУЭ)</text>
    <text x="720" y="368" class="detail-t">• Modbus / BACnet</text>
    <text x="720" y="386" class="detail-t">• Реальное время</text>
    <use href="#badge" x="680" y="290" width="30" height="30"/><text x="695" y="310" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">4</text>
  </g>

  <!-- Phase 5 -->
  <g id="phase5" class="card pop-in" style="animation-delay:.20s" aria-label="Фаза 5: Отчётность">
    <rect class="report-box" x="940" y="200" width="200" height="118" filter="url(#shadow-success)"/>
    <text x="960" y="228" class="phase-t" style="fill:#166534">Фаза 5</text>
    <text x="960" y="248" class="detail-t">Отчёты для GR / надзора</text>
    <text x="960" y="268" class="detail-t">• API / EDI интеграция</text>
    <text x="960" y="286" class="detail-t">• Агрегированные данные</text>
    <use href="#badge" x="920" y="190" width="30" height="30"/><text x="935" y="210" style="font:700 12px Arial; fill:#fff; text-anchor:middle;">5</text>
  </g>

  <!-- Flows -->
  <!-- 1 -> 2 -->
  <path class="success-arrow flow-anim" d="M270,260 C300,290 320,200 360,300"/>
  <!-- 2 -> 3 (critical) -->
  <path class="warn-arrow flow-anim" d="M450,350 C480,380 520,250 560,400"/>
  <!-- 3 -> 4 -->
  <path class="success-arrow flow-anim" d="M660,466 C580,438 710,422 700,350"/>
  <!-- 4 -> 5 -->
  <path class="success-arrow flow-anim" d="M900,340 C930,310 950,350 940,268"/>
  <!-- Auxiliary data bus (dash blue) -->
  <path class="side-arrow flow-anim" d="M270,220 C450,180 740,180 940,230"/>

  <!-- Legend -->
  <g id="legend" class="card pop-in" style="animation-delay:.26s" aria-label="Легенда">
    <text x="88" y="600" class="phase-t">Легенда:</text>
    <line x1="88" y1="630" x2="118" y2="630" class="success-arrow flow-anim"/>
    <text x="124" y="635" class="legend-t">Основной поток</text>
    <line x1="230" y1="630" x2="270" y2="630" class="warn-arrow flow-anim"/>
    <text x="275" y="635" class="legend-t">Критический процесс</text>
    <line x1="402" y1="630" x2="422" y2="630" class="side-arrow flow-anim"/>
    <text x="428" y="635" class="legend-t">Вспомогательные связи</text>
  </g>
</svg>